oad outside is already under water.\n\nWhat do you do first?", "opzioni": ["Go up to the second floor, not the attic", "Climb into the attic and close the hatch", "Wade to the neighbor’s house on the hill", "Drive out before the road gets deeper"], "giusta": 0, "spiegazione": "S18’s step zero: “Rising water: higher ground or a higher floor, never a closed attic.” And “Never walk, swim or drive into floodwater: 6 inches of fast water can knock you down.”", "rimando": "Scenario S18 · Skill 9.4-4", "medica": false}, {"id": "hom-01-027", "area": "At Home", "scenario": "S18", "tipo": "scelta", "domanda": "You’re leaving on an evacuation order when water covers the road ahead. It looks only a few inches deep, but it’s moving.\n\nWhat do you do first?", "opzioni": ["Walk it first to check the depth", "Follow the pickup ahead of you through", "Drive through slowly in low gear", "Turn around and find another way out"], "giusta": 3, "spiegazione": "S18: on a flooded road, “Turn Around, Don’t Drown” (NWS). Six inches of fast water can knock you down, so walking it to check is no safer.", "rimando": "Scenario S18 · Skill 12.3-4", "medica": false}, {"id": "hom-01-028", "area": "At Home", "scenario": "S18", "tipo": "scelta", "domanda": "An ice storm knocked out the power two days ago, and the house is down to 50°F. Now the radio gives a flood warning, and the creek is rising toward the yard.\n\nWhich page do you open first?", "opzioni": ["S17 · After the Storm: Cut Off, Roads Closed", "S13 · Power Out in Winter", "S18 · Flood Warning or Rising Water", "S20 · Snowed In for Days"], "giusta": 2, "spiegazione": "The index: “If two scenarios fit, start with the one that threatens first.” Chapter 2 gives this very case: “A flood in winter is a flood before it is a cold house.”", "rimando": "Scenario S18 · Skill 12.1-3", "medica": false}, {"id": "hom-01-029", "area": "At Home", "scenario": "S18", "tipo": "ordine", "domanda": "A flood warning is up, and water is already in the street. Your neighbor has cut his hand, and your mother’s insulin is in the fridge.\n\nAfter step zero, put these needs in order for this ground.", "opzioni": ["Higher ground → Word out → First aid → Medical needs → Water", "Higher ground → First aid → Water → Medical needs → Word out", "First aid → Higher ground → Medical needs → Word out → Water", "Higher ground → First aid → Medical needs → Word out → Water"], "giusta": 3, "spiegazione": "On most home pages first aid comes first, but S18 reads “Higher ground · first aid · medical needs · word out · water · food.” With the water rising, getting above it comes before everything else.", "rimando": "Scenario S18 · Skill 12.3-4", "medica": true}, {"id": "hom-01-030", "area": "At Home", "scenario": "S18", "tipo": "scelta", "domanda": "The water has you trapped on the second floor, and the stairs are under water. It’s dark, and your phone still has a signal.\n\nWhat do you do first?", "opzioni": ["Wade down to switch off the main breaker", "Call 911 and give your location", "Climb into the attic and shut the hatch", "Flash a light from the window and wait"], "giusta": 1, "spiegazione": "S18: “Trapped: call 911 with your location, signal with a flashlight, answer voices with three whistle blasts.” The light comes after the call; a closed attic is never the place, and in water you touch nothing electric.", "rimando": "Scenario S18 · Skill 9.4-4", "medica": false}, {"id": "hom-02-001", "area": "At Home", "scenario": "S19", "tipo": "scelta", "domanda": "A neighbor’s fuel tank leaked near your well last night. This morning the tap water smells of gasoline.\n\nWhat do you do first?", "opzioni": ["Stop drinking it and use stored water", "Boil it at a rolling boil for 1 minute", "Run it through the water filter twice", "Add 8 drops of bleach per gallon"], "giusta": 0, "spiegazione": "S19 starts here: “Stop drinking the suspect water. Fuel or chemical smell: boiling, bleach and filters won’t fix it.” All three deal with germs; fuel stays in, so you live on stored water (8.3-7).", "rimando": "Scenario S19 · Skill 8.3-7", "medica": false}, {"id": "hom-02-002", "area": "At Home", "scenario": "S19", "tipo": "scelta", "domanda": "The town puts out a boil-water notice, and your 4-month-old grandson drinks powdered formula. You have no ready-to-use formula, but there are sealed bottles of water in the pantry.\n\nWhat do you mix the formula with?", "opzioni": ["Bottled water from the pantry", "Water from the fridge’s water dispenser", "Hot water straight from the tap", "Tap water run through a filter pitcher"], "giusta": 0, "spiegazione": "S19, step 2: “Baby formula: ready-to-use, or made with bottled water.” Under a notice, tap water is out even if you filter it, and so are the fridge’s water and ice dispensers (8.4-3).", "rimando": "Scenario S19 · Skill 8.4-3", "medica": false}, {"id": "hom-02-003", "area": "At Home", "scenario": "S19", "tipo": "ordine", "domanda": "A water main broke, the town issued a boil-water notice, and the power is out too. Nobody is hurt, and your wife’s insulin is in the dead fridge.\n\nAfter step zero, put these needs in order for this ground.", "opzioni": ["Stored water → Medical needs → Treated water → Washing", "Stored water → Treated water → Washing → Medical needs", "Medical needs → Stored water → Treated water → Washing", "Medical needs → Treated water → Stored water → Washing"], "giusta": 2, "spiegazione": "S19 reads “First aid · medical needs · stored water · treated water · washing,” and nobody here is hurt. The insulin goes into a cooler first; then you drink what you stored before you treat more, and washing comes last.", "rimando": "Scenario S19 · Skill 8.4-6", "medica": false}, {"id": "hom-02-004", "area": "At Home", "scenario": "S19", "tipo": "scelta", "domanda": "A boil-water notice is in effect at your house, 800 feet above sea level, and the kitchen stove works. Your brother, who served in the Air Force, says the old rule was 10 minutes.\n\nHow long do you boil the water?", "opzioni": ["A full rolling boil for 3 minutes", "1 minute from the first small bubbles", "A full rolling boil for 10 minutes", "A full rolling boil for 1 minute"], "giusta": 3, "spiegazione": "S19, step 3: “full rolling boil, 1 minute; 3 minutes above 5,000 feet.” The page’s note says it plainly: “The 1985 regulation boiled 10 minutes; the CDC and EPA say 1.” And you count from the rolling boil, not the first small bubbles (8.3-3).", "rimando": "Scenario S19 · Skill 8.3-3", "medica": false}, {"id": "hom-02-005", "area": "At Home", "scenario": "S19", "tipo": "scelta", "domanda": "Floodwater covered your well head for a day and has now gone down. The pump switch is in the shed, and you have two cases of bottled water.\n\nWhat do you do first?", "opzioni": ["Pour a jug of bleach down the well yourself", "Use bottled water; call the health department", "Boil the well water for 1 minute before drinking", "Switch the pump on for a while to flush the well"], "giusta": 1, "spiegazione": "S19, step 5: a flooded well, “don’t drink or wash with it, don’t switch on the pump; call the health department.” A flooded pump risks a shock, and the well is disinfected by a contractor and drunk from only after a safe lab test (8.4-4, 8.4-5).", "rimando": "Scenario S19 · Skill 8.4-4", "medica": false}, {"id": "hom-02-006", "area": "At Home", "scenario": "S20", "tipo": "scelta", "domanda": "Day three snowed in, the furnace is running, and a drift has buried the side of the house where its vent comes out. Your granddaughter has a headache and feels sick, and now your wife says she’s dizzy.\n\nWhat do you do first?", "opzioni": ["Lay them down in the warmest room", "Get everyone outside, then go to S15", "Open S20 and check that the vents are clear", "Dig the snow away from the furnace vent"], "giusta": 1, "spiegazione": "The index is plain: at home, if the air may not be safe, “get everyone out, then go straight to S15,” and S20’s step zero says the same. The buried vent is the likely cause, and S15 deals with the cause last, once crews say it is safe.", "rimando": "Scenario S20 · Skill 7.4-5", "medica": true}, {"id": "hom-02-007", "area": "At Home", "scenario": "S20", "tipo": "scelta", "domanda": "You’ve been snowed in for two days, and a foot of new snow fell overnight. The furnace and dryer are running, the alarms are quiet, and everyone feels fine.\n\nWhat do you do first?", "opzioni": ["Clear the snow off the outside vents", "Close off every room but the warm one", "Stuff towels around the vents and doors", "Count the food against the days ahead"], "giusta": 0, "spiegazione": "S20, step 1: “After each snowfall, clear the outside vents of the furnace, dryer, stove and fireplace.” Safe air comes before warmth and food on this page, and a vent is never blocked: “Seal drafts, never vents” (6.4-2).", "rimando": "Scenario S20 · Skill 7.4-3", "medica": false}, {"id": "hom-02-008", "area": "At Home", "scenario": "S20", "tipo": "scelta", "domanda": "Day four snowed in, and the power goes out just after dark. The furnace stops, the alarms are quiet, nobody feels sick, and the house begins to cool.\n\nWhich page do you open first?", "opzioni": ["S15 · Carbon Monoxide Alarm or Symptoms", "S17 · After the Storm: Cut Off, Roads Closed", "S13 · Power Out in Winter", "S24 · Phones and Internet Down, Family Apart"], "giusta": 2, "spiegazione": "S20 sends you there itself, in step 2: “If the power goes, open S13.” With no alarm and no symptoms, nothing points to bad air, and a dark house cooling in winter is S13’s ground.", "rimando": "Scenario S20 · Skill 6.4-1", "medica": false}, {"id": "hom-02-009", "area": "At Home", "scenario": "S20", "tipo": "ordine", "domanda": "In the cold woods, warmth comes right after first aid. Today you’re snowed in at home with the power on, nobody is hurt, and your father’s oxygen machine runs off the wall outlet.\n\nAfter step zero, put these needs in order for this ground.", "opzioni": ["Warmth, safely → Safe air → Medical needs → Water", "Safe air → Warmth, safely → Water → Medical needs", "Medical needs → Warmth, safely → Safe air → Water", "Safe air → Medical needs → Warmth, safely → Water"], "giusta": 3, "spiegazione": "S20 reads “First aid · safe air · medical needs · warmth, safely · water · food, moving up as days pass,” and nobody here is hurt. In the woods warmth follows first aid; snowed in at home, the dangers the house creates come first: the air, and a device that needs power.", "rimando": "Scenario S20 · Skill 5.3-4", "medica": false}, {"id": "hom-02-010", "area": "At Home", "scenario": "S20", "tipo": "scelta", "domanda": "Snowed in for five days, the plow is still days away, and the pantry is running down. Your son-in-law wants to put everyone on half rations, water included.\n\nWhat do you do about food and water?", "opzioni": ["Ration water to one cup per person at each meal", "Save the fridge food and eat the canned food first", "Divide the food by the days; don’t ration water", "Cut both food and water to half for everyone"], "giusta": 2, "spiegazione": "S20, step 5: “Count the food and divide it by the days until new supplies; eat what spoils first. Don’t ration drinking water unless officials say so.” Children, nursing mothers and sick people may need more water, not less (8.1-3).", "rimando": "Scenario S20 · Skill 11.1-3", "medica": false}, {"id": "hom-02-011", "area": "At Home", "scenario": "S21", "tipo": "scelta", "domanda": "A wildfire is burning in the hills west of town, and the county says to get ready to leave, not to go yet. Smoke is starting to drift over your street.\n\nWhat do you do first?", "opzioni": ["Turn on the battery radio for official news", "Seal one room and start a box fan with a filter", "Text the family where you’ll all meet", "Set the air conditioning to recirculate"], "giusta": 0, "spiegazione": "On S21 officials’ orders come first, and step 1 is how you hear them: “Keep a battery or hand-crank radio on for official news.” A get-ready order can become an order to go; the clean room, the air conditioning and the family texts come later on the page.", "rimando": "Scenario S21 · Skill 9.4-1", "medica": false}, {"id": "hom-02-012", "area": "At Home", "scenario": "S21", "tipo": "scelta", "domanda": "You’re leaving on an evacuation order, and everyone is already in the car. There’s a minute to leave word for your son, who is driving home from college.\n\nWhere does the note go?", "opzioni": ["In the mailbox down by the road, with the flag up", "On the porch post, where the fire crews can read it", "On the outside of the front door, where he’ll see it", "Inside the door, and texted to your out-of-town contact"], "giusta": 3, "spiegazione": "S21, step 4: “tape a note inside the door, never outside, and text it to your out-of-town contact.” A note outside the house tells strangers it is empty (9.4-4).", "rimando": "Scenario S21 · Skill 9.4-4", "medica": false}, {"id": "hom-02-013", "area": "At Home", "scenario": "S21", "tipo": "ordine", "domanda": "A wildfire is 15 miles off, and officials say get ready to leave. Nobody is hurt, your husband’s insulin is in the fridge, and your daughter lives across town.\n\nAfter step zero, put these needs in order for this ground.", "opzioni": ["Ready to leave → Officials’ orders → Medical needs → Word out → Clean air", "Officials’ orders → Medical needs → Ready to leave → Clean air → Word out", "Officials’ orders → Word out → Medical needs → Clean air → Ready to leave", "Officials’ orders → Clean air → Ready to leave → Medical needs → Word out"], "giusta": 1, "spiegazione": "S21 reads “Officials’ orders · first aid · medical needs · ready to leave · clean air · word out,” and nobody here is hurt. The insulin goes in a cooler to leave with you, then the bag, then the clean room, and word to your daughter comes last.", "rimando": "Scenario S21 · Skill 6.4-6", "medica": false}, {"id": "hom-02-014", "area": "At Home", "scenario": "S21", "tipo": "scelta", "domanda": "Officials haven’t told you to leave, but wildfire smoke hangs thick over your street. Your mother, 72, lives with you and has a lung condition.\n\nHow do you keep her out of the smoke?", "opzioni": ["Run the AC with fresh air coming in from outside", "Run an ozone air purifier in her bedroom", "Close up one room and run a filtered box fan", "Open the windows to keep the air moving"], "giusta": 2, "spiegazione": "S21, step 5: “one room for everyone, windows and doors shut, an air cleaner that makes no ozone, or a box fan with a filter,” and step 6 sets the air conditioning to recirculate. Adults over 65 and lung patients are among the most at risk from smoke (12.5-3).", "rimando": "Scenario S21 · Skill 12.5-3", "medica": true}, {"id": "hom-02-015", "area": "At Home", "scenario": "S21", "tipo": "scelta", "domanda": "A wildfire is two ridges away, and you’re packing to leave. Then you smell smoke inside and see it curling from the attic hatch.\n\nWhat do you do first?", "opzioni": ["Climb up with the fire extinguisher to take a look", "Get everyone out, then call 911 from outside", "Finish loading the car, then call 911", "Call 911 from the kitchen, then get out"], "giusta": 1, "spiegazione": "S21’s step zero: “Fire or smoke inside the house: everyone out, stay out, and call 911 from outside.” Calling from the kitchen or going up to look keeps people inside with the smoke (7.4-6).", "rimando": "Scenario S21 · Skill 7.4-6", "medica": false}, {"id": "hom-02-016", "area": "At Home", "scenario": "S22", "tipo": "scelta", "domanda": "You’re visiting your sister in her mobile home when the weather radio sounds a tornado warning. The park has a storm shelter a short walk away.\n\nWhat do you do first?", "opzioni": ["Stay put: the home is tied down", "Get in the bathtub and cover your heads", "Drive to the highway overpass for cover", "Go now to the park’s storm shelter"], "giusta": 3, "spiegazione": "S22’s step zero: “Go now to a safe room or storm shelter if you have one… A mobile home is not a shelter.” Tie-downs don’t change that, and you never shelter under a bridge (12.1-5).", "rimando": "Scenario S22 · Skill 12.1-5", "medica": false}, {"id": "hom-02-017", "area": "At Home", "scenario": "S22", "tipo": "scelta", "domanda": "You’ve been in the interior bathroom for twenty minutes, and the roar has passed. The radio says the tornado warning is still in effect.\n\nWhat comes next?", "opzioni": ["Stay in the room with the radio on", "Step outside to look at the sky", "Drive over to check on your mother", "Go out and check the house for damage"], "giusta": 0, "spiegazione": "S22, step 1: “Stay in the shelter room, radio on, until the threat has ended. More storms can follow.” Checking the people and the house comes once the threat is over (steps 5 and 6).", "rimando": "Scenario S22 · Skill 12.1-3", "medica": false}, {"id": "hom-02-019", "area": "At Home", "scenario": "S22", "tipo": "ordine", "domanda": "A tornado warning sounds as the storm bears down on your town. Your wife’s insulin is in the fridge upstairs, and your son is at work across town.\n\nAfter step zero, put these needs in order for this ground.", "opzioni": ["Shelter → First aid → Safe ground → Medical needs → Word out", "First aid → Shelter → Safe ground → Medical needs → Word out", "Shelter → Medical needs → First aid → Word out → Safe ground", "Shelter → First aid → Word out → Medical needs → Safe ground"], "giusta": 0, "spiegazione": "S22 reads “Shelter · first aid · safe ground · medical needs · word out · water.” On most home pages first aid leads; here shelter does, and once the threat has ended come the people, then the ground around them, and only then the insulin and the text to your son.", "rimando": "Scenario S22 · Skill 12.1-5", "medica": false}, {"id": "hom-02-020", "area": "At Home", "scenario": "S22", "tipo": "scelta", "domanda": "Phones and internet have been down since noon, and your wife is somewhere across town. Now the radio sounds a tornado warning, and you take the book into the interior bathroom.\n\nWhich page do you open first?", "opzioni": ["S17 · After the Storm: Cut Off, Roads Closed", "S24 · Phones and Internet Down, Family Apart", "S18 · Flood Warning or Rising Water", "S22 · Tornado Warning"], "giusta": 3, "spiegazione": "The index: “If two scenarios fit, start with the one that threatens first.” The tornado threatens first: S22 keeps you in the shelter room until the threat has ended, and S24, word from your wife, comes after.", "rimando": "Scenario S22 · Skill 12.1-3", "medica": false}, {"id": "hom-02-021", "area": "At Home", "scenario": "S23", "tipo": "scelta", "domanda": "An earthquake wakes you at 3 a.m., the bed lurching and something crashing in the hall. The shaking is still going.\n\nWhat do you do first?", "opzioni": ["Get up and hurry to check on the grandkids", "Jump up and stand in the bedroom doorway", "Stay in bed, face down, pillow over head", "Run downstairs and out into the open yard"], "giusta": 2, "spiegazione": "S23’s step zero: “In bed: stay there, face down, a pillow over your head. Don’t run outside or into a doorway while it shakes.” You check on the others once it stops, with shoes on against broken glass (12.5-4).", "rimando": "Scenario S23 · Skill 12.5-4", "medica": false}, {"id": "hom-02-022", "area": "At Home", "scenario": "S23", "tipo": "scelta", "domanda": "On the tornado page, shelter comes before first aid. Here the earthquake has stopped, the house looks sound, and there’s no fire, smoke or gas smell.\n\nAfter step zero, which need comes first on this page?", "opzioni": ["Safe ground", "First aid", "Shelter", "Stay or go"], "giusta": 1, "spiegazione": "S23 reads “First aid · safe ground · medical needs · stay or go · word out · water.” In a tornado you stay sheltered until the threat ends; once the shaking stops and nothing burns or leaks, the people come first: “Check the people: press hard on any bleeding, and call 911 for anyone badly hurt.”", "rimando": "Scenario S23 · Skill 4.1-5", "medica": true}, {"id": "hom-02-023", "area": "At Home", "scenario": "S23", "tipo": "scelta", "domanda": "You live a few blocks from the beach, and a strong quake has just shaken the house for nearly a minute. The shaking has stopped, nobody is hurt, and no warning has come over the radio.\n\nWhat do you do first?", "opzioni": ["Head for high ground or inland now", "Pack the car, then decide where to go", "Walk down to the beach to watch the water", "Wait for an official tsunami warning"], "giusta": 0, "spiegazione": "S23’s step zero: “Near the coast, a strong or long quake: high ground or inland now. Don’t wait for a warning.” Waiting for the radio, packing or watching the water all spend time the page tells you not to spend.", "rimando": "Scenario S23 · Skill 12.5-4", "medica": false}, {"id": "hom-02-024", "area": "At Home", "scenario": "S23", "tipo": "scelta", "domanda": "The shaking has stopped, the house is sound, and there’s no gas smell. A falling bookcase knocked your father, 74, to the floor; it’s off him now, he’s awake, and he says his neck hurts.\n\nWhat do you do first?", "opzioni": ["Roll him onto his side to rest", "Help him sit up slowly in a chair", "Keep his head and neck still, as found", "Slide a pillow under his head and neck"], "giusta": 2, "spiegazione": "S23, step 3: “Leave the injured where they are unless the place is dangerous. If the neck or back may be hurt, hold the head and neck still, as found.” Have someone call 911 while you hold him (4.2-9); sitting him up, rolling him or a pillow all move the neck.", "rimando": "Scenario S23 · Skill 4.2-9", "medica": true}, {"id": "hom-02-025", "area": "At Home", "scenario": "S23", "tipo": "ordine", "domanda": "The shaking has stopped, and there’s no fire or gas smell. Your wife has a cut hand, the power is out with her insulin in the fridge, and your son is at school across town.\n\nAfter step zero, put these needs in order for this ground.", "opzioni": ["Safe ground → First aid → Stay or go → Medical needs → Word out", "First aid → Safe ground → Medical needs → Stay or go → Word out", "First aid → Medical needs → Safe ground → Word out → Stay or go", "First aid → Word out → Safe ground → Medical needs → Stay or go"], "giusta": 1, "spiegazione": "S23 reads “First aid · safe ground · medical needs · stay or go · word out · water.” The cut comes first, then the house and the lines around it, then the insulin; whether to stay or go is settled before the text to your son.", "rimando": "Scenario S23 · Skill 4.1-5", "medica": true}, {"id": "hom-02-026", "area": "At Home", "scenario": "S24", "tipo": "scelta", "domanda": "Since the storm, you and the family have been texting, not talking, to keep the lines clear. Then your neighbor falls off his ladder and lies in the yard, awake but unable to get up.\n\nWhat do you do first?", "opzioni": ["Help him up and get him into your truck", "Text 911, to keep the lines free", "Text his wife to come home now", "Call 911 and talk to the operator"], "giusta": 3, "spiegazione": "S24’s step zero: “Someone hurt or in danger: call 911 by voice when you can.” Text, don’t talk is for the family; for 911 you call, and text only if you can’t talk (9.4-2, 4.1-2). Moving him could hurt a neck or back (4.2-9).", "rimando": "Scenario S24 · Skill 4.1-2", "medica": true}, {"id": "hom-02-027", "area": "At Home", "scenario": "S24", "tipo": "scelta", "domanda": "After the storm, calls to your daughter across town won’t connect, but now and then a text goes through. You want her to know you’re safe at the church shelter.\n\nHow do you reach her?", "opzioni": ["Send a long text with all the details", "Leave a voicemail on her home phone", "Keep calling until a call goes through", "Text her: “I’m OK. At church shelter.”"], "giusta": 3, "spiegazione": "S24, step 1: “Text, don’t talk, and keep it short. FEMA’s example: ‘I’m OK. At library.’” Texts get through more reliably and leave the lines free for emergency workers (9.4-2).", "rimando": "Scenario S24 · Skill 9.4-2", "medica": false}, {"id": "hom-02-028", "area": "At Home", "scenario": "S24", "tipo": "scelta", "domanda": "All morning, local calls fail and your texts to your wife show “not delivered.” Your family card names your brother in Ohio as the out-of-town contact.\n\nWhat do you try next?", "opzioni": ["Call your brother in Ohio", "Call 911 and ask them to find her", "Drive around town looking for her", "Keep calling her local number"], "giusta": 0, "spiegazione": "S24, step 2: “Everyone reports to one out-of-town contact: a long-distance call may connect when a local one fails.” If your wife has reported in, your brother knows where she is; 911 is for someone hurt or in danger.", "rimando": "Scenario S24 · Skill 9.4-2", "medica": false}, {"id": "hom-02-029", "area": "At Home", "scenario": "S24", "tipo": "ordine", "domanda": "After a big storm, phones and internet are down, and your son is at practice across town. A falling branch has gashed your arm, and your mother’s insulin is in the dead fridge.\n\nAfter step zero, put these needs in order for this ground.", "opzioni": ["Word out → The meeting place → Safety where you are → First aid → Medical needs", "Safety where you are → Word out → First aid → Medical needs → The meeting place", "Safety where you are → First aid → Medical needs → Word out → The meeting place", "First aid → Safety where you are → Medical needs → The meeting place → Word out"], "giusta": 2, "spiegazione": "S24 reads “Safety where you are · first aid · medical needs · word out · the meeting place.” Worry pulls you toward your son, but the page puts your own safety, the arm and the insulin ahead of the texts, and the meeting place last.", "rimando": "Scenario S24 · Skill 9.4-3", "medica": true}, {"id": "hom-02-030", "area": "At Home", "scenario": "S24", "tipo": "scelta", "domanda": "There’s been no word from your wife for hours, and the family card says to meet at the library. The radio says officials want everyone to stay indoors until the ice storm passes.\n\nWhat do you do first?", "opzioni": ["Walk to the library on the side streets", "Stay home, as officials say, radio on", "Go door to door asking the neighbors", "Drive carefully to the library now"], "giusta": 1, "spiegazione": "S24, step 3: go to the meeting place “only if getting there is safe and officials haven’t told you to stay inside.” When officials say stay inside, you do it now (S00), and the radio tells you when that changes (step 5).", "rimando": "Scenario S24 · Skill 9.4-3", "medica": false}, {"id": "hom-03-001", "area": "At Home", "scenario": "S22", "tipo": "scelta", "domanda": "You’re on a flat country road when the radio warns of a tornado headed your way. No shelter is close enough to reach, and the fields lie level with the road.\n\nWhat do you do first?", "opzioni": ["Get out and lie flat on the ground right beside the car", "Floor it and try to outrun the storm down the road", "Stay belted, head below the windows and covered", "Pull in and shelter under the highway overpass up ahead"], "giusta": 2, "spiegazione": "S22, step 2: “In a car: drive to the nearest shelter. Can’t? Stay belted, head below the windows and covered.” Getting out works only if you can safely get well below the road, clear of cars, and never under a bridge (S22, steps 3-4; 12.1-5).", "rimando": "Scenario S22 · Skill 12.1-5", "medica": false}], "mazzi": [{"k": "campo", "nome": "m_campo", "desc": "m_campo_desc", "aree": ["Before Any Scenario", "In the Field"]}, {"k": "casa", "nome": "m_casa", "desc": "m_casa_desc", "aree": ["Before Any Scenario", "At Home"]}]};
// Base comune delle web app dei bonus: testi, salvataggio nel browser, codice d'accesso, finestre (mai alert/confirm).
"use strict";
const T = (k, d) => (CONFIG.testi && CONFIG.testi[k] !== undefined ? CONFIG.testi[k] : d);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CHIAVE = "bonus:" + (CONFIG.id || "app");
const Memoria = {
  leggi(k, d) { try { const v = localStorage.getItem(CHIAVE + ":" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  scrivi(k, v) { try { localStorage.setItem(CHIAVE + ":" + k, JSON.stringify(v)); } catch (e) { /* senza memoria: si lavora lo stesso */ } },
  togli(k) { try { localStorage.removeItem(CHIAVE + ":" + k); } catch (e) { /* niente */ } },
};
// FNV-1a 32 bit con sale: non è una serratura, è un deterrente (il codice non sta in chiaro nel file).
function impronta(s) {
  s = (CONFIG.id || "") + "|" + String(s).trim().toUpperCase().replace(/\s+/g, "");
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16);
}
function finestra(titolo, testo, bottoni) {
  return new Promise((ok) => {
    const m = document.createElement("div");
    m.className = "modale";
    m.innerHTML = `<div class="card" role="dialog" aria-modal="true"><h2>${esc(titolo)}</h2><p>${esc(testo)}</p><div class="row"></div></div>`;
    const r = $(".row", m);
    bottoni.forEach(([etichetta, valore, classe]) => {
      const b = document.createElement("button");
      b.textContent = etichetta; if (classe) b.className = classe;
      b.onclick = () => { m.remove(); ok(valore); };
      r.appendChild(b);
    });
    document.body.appendChild(m);
    $("button", m).focus();
  });
}
function intestazione() {
  document.documentElement.lang = CONFIG.lingua || "en";
  document.title = CONFIG.titolo;
  if (CONFIG.colori) {
    if (CONFIG.colori.accento) document.documentElement.style.setProperty("--acc", CONFIG.colori.accento);
    if (CONFIG.colori.secondo) document.documentElement.style.setProperty("--sec", CONFIG.colori.secondo);
  }
  $("header.app .et").textContent = T("etichetta", "Extra content");
  $("header.app h1").textContent = CONFIG.titolo;
  $("header.app .sub").innerHTML = esc(T("per_lettori", "For readers of")) + " <i>" + esc(CONFIG.libro) + "</i>" + (CONFIG.autore ? " · " + esc(CONFIG.autore) : "");
  const f = $("footer.app .in");
  f.innerHTML = "";
  [CONFIG.avvertenza, CONFIG.non_affiliato, T("memoria", "Your progress is saved only in this browser, on this device.")]
    .filter(Boolean).forEach((t) => { const p = document.createElement("p"); p.textContent = t; f.appendChild(p); });
}
function porta(avvia) {
  intestazione();
  if (!CONFIG.codice_impronta || Memoria.leggi("aperta", false) === CONFIG.codice_impronta) { avvia(); return; }
  const p = document.createElement("section");
  p.id = "porta";
  p.innerHTML = `<div class="card"><h2>${esc(T("codice_titolo", "Enter your access code"))}</h2>
    <p class="muted">${esc(T("codice_dove", "You will find the code inside your copy of the book."))}</p>
    <label class="lab" for="codice">${esc(T("codice_etichetta", "Access code"))}</label>
    <input id="codice" type="text" autocomplete="off" autocapitalize="characters">
    <p id="codice_err" class="ko nascosto">${esc(T("codice_errato", "This code doesn't match. Check it in the book and try again."))}</p>
    <div class="row" style="margin-top:12px"><button id="codice_ok">${esc(T("codice_apri", "Open"))}</button></div></div>`;
  $("main .in").prepend(p);
  const prova = () => {
    if (impronta($("#codice").value) === CONFIG.codice_impronta) { Memoria.scrivi("aperta", CONFIG.codice_impronta); p.remove(); avvia(); }
    else { $("#codice_err").classList.remove("nascosto"); }
  };
  $("#codice_ok").onclick = prova;
  $("#codice").addEventListener("keydown", (e) => { if (e.key === "Enter") prova(); });
  $("#codice").focus();
}
function mescola(a, rnd = Math.random) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// Le carte (DATI.carte) vengono dai lotti chiusi del protocollo dei controllori, con le opzioni bilanciate da domande.py unisci.
const CARTE = DATI.carte;
const FRECCIA = " → ";
let coda = [], corrente = null, mazzo = "*", fatte = 0, giuste = 0, totale = 0, scelti = [], risposta_data = false;

const stato = () => Memoria.leggi("carte", {});
const sbagliate = () => Memoria.leggi("sbagliate", []);
function segna(id, ok) {
  const s = stato();
  s[id] = { ok: ok ? 1 : 0, volte: ((s[id] && s[id].volte) || 0) + 1 };
  Memoria.scrivi("carte", s);
  let sb = sbagliate().filter((x) => x !== id);
  if (!ok) sb.push(id);
  Memoria.scrivi("sbagliate", sb);
}
function nelMazzo(c, k) {
  if (k === "*") return true;
  if (k === "!") return sbagliate().includes(c.id);
  return DATI.mazzi.find((m) => m.k === k).aree.includes(c.area);
}
function nomeMazzo(k) {
  if (k === "*") return T("tutte", "All 25 pages");
  if (k === "!") return T("da_ripassare", "The ones I missed");
  return T(DATI.mazzi.find((m) => m.k === k).nome, "");
}

// ---- la schermata d'inizio: i mazzi
function mazzi() {
  const s = stato();
  const voci = DATI.mazzi.map((m) => m.k).concat(["*"]);
  const sb = sbagliate();
  if (sb.length) voci.push("!");
  $("#mazzi").innerHTML = voci.map((k) => {
    const pool = CARTE.filter((c) => nelMazzo(c, k));
    const sapute = pool.filter((c) => s[c.id] && s[c.id].ok === 1).length;
    const desc = k === "!" ? T("da_ripassare_desc", "") : T((DATI.mazzi.find((m) => m.k === k) || { desc: "tutte_desc" }).desc, "");
    return `<button class="mazzo ${k === "!" ? "ripasso" : ""}" data-k="${esc(k)}">
      <strong>${esc(nomeMazzo(k))}</strong><span class="muted">${esc(desc)}</span>
      <span class="muted">${pool.length} ${esc(T("carte", "cards"))} · ${sapute} ${esc(T("giuste_ultima", "right the last time"))}</span>
      <span class="bar"><span style="width:${Math.round(100 * sapute / (pool.length || 1))}%"></span></span></button>`;
  }).join("");
  $$("#mazzi .mazzo").forEach((b) => b.onclick = () => giro(b.dataset.k));
}
function mostraSezione(id) { ["inizio", "giro", "fine"].forEach((x) => $("#" + x).classList.toggle("nascosto", x !== id)); window.scrollTo(0, 0); }
function inizio() { mostraSezione("inizio"); mazzi(); }

// ---- il giro: le carte mescolate a ogni giro
function giro(k) {
  mazzo = k;
  const n = parseInt($("#quante").value, 10);
  let pool = mescola(CARTE.filter((c) => nelMazzo(c, k)));
  if (n > 0) pool = pool.slice(0, n);
  coda = pool; fatte = 0; giuste = 0; totale = coda.length;
  Memoria.scrivi("impostazioni", { quante: $("#quante").value, famiglia: $("#famiglia").checked });
  $("#g_mazzo").textContent = nomeMazzo(k);
  mostraSezione("giro");
  mostra();
}
function mostra() {
  if (!coda.length) { fine(); return; }
  corrente = coda[0]; risposta_data = false; scelti = [];
  const [sit, dom] = corrente.domanda.split("\n\n");
  $("#carta").dataset.id = corrente.id;
  $("#g_scenario").textContent = corrente.scenario === "S00" ? T("s00", "Before Any Scenario") : `${T("scenario", "Scenario")} ${corrente.scenario}`;
  $("#c_situazione").textContent = dom ? sit : "";
  $("#c_domanda").textContent = dom || sit;
  $("#g_conto").textContent = `${fatte + 1} / ${totale}`;
  $("#g_bar").style.width = Math.round(100 * fatte / (totale || 1)) + "%";
  $("#g_punti").textContent = $("#famiglia").checked ? `${T("punti_giro", "This round")}: ${giuste} / ${fatte}` : "";
  $("#esito").classList.add("nascosto");
  const ordine = corrente.tipo === "ordine";
  $("#opzioni").classList.toggle("nascosto", ordine);
  $("#ordine").classList.toggle("nascosto", !ordine);
  if (ordine) preparaOrdine(); else preparaScelta();
}
function preparaScelta() {
  $("#opzioni").innerHTML = corrente.opzioni.map((o, i) => `<button class="opz" data-i="${i}">${esc(o)}</button>`).join("");
  $$("#opzioni .opz").forEach((b) => b.onclick = () => rispondiScelta(parseInt(b.dataset.i, 10)));
}
function rispondiScelta(i) {
  if (risposta_data) return;
  const ok = i === corrente.giusta;
  $$("#opzioni .opz").forEach((b, j) => { b.disabled = true; if (j === corrente.giusta) b.classList.add("giusta"); if (j === i && !ok) b.classList.add("sbagliata"); });
  esito(ok);
}
function elementi() { return corrente.opzioni[corrente.giusta].split(FRECCIA); }
function preparaOrdine() {
  const pezzi = mescola(elementi());
  $("#pezzi").innerHTML = pezzi.map((p) => `<button class="pezzo sec" data-p="${esc(p)}">${esc(p)}</button>`).join("");
  $$("#pezzi .pezzo").forEach((b) => b.onclick = () => { if (risposta_data || b.disabled) return; scelti.push(b.dataset.p); b.disabled = true; disegnaScelti(); });
  disegnaScelti();
}
function disegnaScelti() {
  $("#scelti").innerHTML = scelti.map((p) => `<li>${esc(p)}</li>`).join("");
  $("#controlla").disabled = scelti.length !== elementi().length || risposta_data;
  $("#annulla_uno").disabled = !scelti.length || risposta_data;
}
function annullaUno() {
  const p = scelti.pop();
  const b = $$("#pezzi .pezzo").find((x) => x.dataset.p === p);
  if (b) b.disabled = false;
  disegnaScelti();
}
function controllaOrdine() {
  if (risposta_data) return;
  const giusto = elementi();
  const ok = scelti.length === giusto.length && scelti.every((p, i) => p === giusto[i]);
  $$("#scelti li").forEach((li, i) => li.classList.add(scelti[i] === giusto[i] ? "giusta" : "sbagliata"));
  esito(ok);
}

// ---- correggere e spiegare
function esito(ok) {
  risposta_data = true;
  if (ok) giuste++;
  segna(corrente.id, ok);
  $("#e_verdetto").textContent = ok ? T("giusto", "Right.") : T("sbagliato", "Not this time.");
  $("#e_verdetto").className = "verdetto " + (ok ? "ok" : "ko");
  $("#e_giusta").innerHTML = `<strong>${esc(corrente.tipo === "ordine" ? T("ordine_giusto", "The order for this ground") : T("prima", "What comes first"))}:</strong> ${esc(corrente.opzioni[corrente.giusta])}`;
  $("#e_spiega").textContent = corrente.spiegazione;
  $("#e_rimando").textContent = `${T("nel_libro", "In the book")}: ${corrente.rimando}`;
  $("#e_medica").classList.toggle("nascosto", !corrente.medica);
  $("#esito").classList.remove("nascosto");
  $("#controlla").disabled = true; $("#annulla_uno").disabled = true;
  $("#g_punti").textContent = $("#famiglia").checked ? `${T("punti_giro", "This round")}: ${giuste} / ${fatte + 1}` : "";
  $("#avanti").focus();
}
function avanti() { coda.shift(); fatte++; mostra(); }
function fine() {
  mostraSezione("fine");
  $("#f_punti").textContent = `${giuste} / ${totale}`;
  const sb = sbagliate().length;
  $("#f_dett").textContent = sb ? `${T("fine_sbagliate", "Cards to go over again")}: ${sb}` : T("fine_nessuna", "No cards to go over again.");
  $("#passa").classList.toggle("nascosto", !$("#famiglia").checked);
}

function avvia() {
  [["t_intro", "intro"], ["t_pratica", "pratica"], ["t_scegli", "scegli"], ["t_quante", "quante"], ["t_q10", "q10"], ["t_q25", "q25"],
   ["t_qtutte", "qtutte"], ["t_famiglia", "famiglia"], ["t_famiglia_aiuto", "famiglia_aiuto"], ["t_tocca", "tocca"],
   ["annulla_uno", "annulla_uno"], ["controlla", "controlla"], ["avanti", "avanti"], ["esci", "esci"], ["t_fine", "fine"],
   ["ancora", "ancora"], ["passa", "passa"], ["torna", "torna"], ["e_medica", "medica"]]
    .forEach(([id, k]) => { const e = document.getElementById(id); if (e) e.textContent = T(k, ""); });
  const imp = Memoria.leggi("impostazioni", {});
  if (imp.quante) $("#quante").value = imp.quante;
  $("#famiglia").checked = !!imp.famiglia;
  $("#famiglia").onchange = () => Memoria.scrivi("impostazioni", { quante: $("#quante").value, famiglia: $("#famiglia").checked });
  $("#quante").onchange = $("#famiglia").onchange;
  $("#annulla_uno").onclick = annullaUno;
  $("#controlla").onclick = controllaOrdine;
  $("#avanti").onclick = avanti;
  $("#esci").onclick = inizio; $("#torna").onclick = inizio;
  $("#ancora").onclick = () => giro(mazzo);
  $("#passa").onclick = () => giro(mazzo === "!" ? "*" : mazzo);
  inizio();
}

porta(avvia);
</script>
</body></html>
