<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>App</title>
<style>
:root { --acc: #1f3a5f; --sec: #e9b949; --ok: #1e7d4f; --ko: #b3261e; --bg: #f5f6f8; --card: #ffffff;
  --ink: #1b1f24; --muted: #5f6873; --line: #dde1e6; --r: 14px; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  -webkit-text-size-adjust: 100%; }
header.app { background: var(--acc); color: #fff; padding: 18px 16px 16px; }
header.app .in, main .in, footer.app .in { max-width: 860px; margin: 0 auto; }
header.app .et { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--sec); }
header.app h1 { margin: 4px 0 2px; font-size: 24px; line-height: 1.15; }
header.app .sub { opacity: .9; font-size: 14px; }
main { padding: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; margin: 0 0 14px;
  box-shadow: 0 1px 2px rgba(0,0,0,.04); }
h2 { font-size: 19px; margin: 0 0 10px; color: var(--acc); }
h3 { font-size: 16px; margin: 14px 0 6px; }
.muted { color: var(--muted); font-size: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1 1 auto; }
button, .btn { font: inherit; border: 0; border-radius: 10px; padding: 11px 16px; cursor: pointer; background: var(--acc);
  color: #fff; font-weight: 600; min-height: 44px; }
button.sec, .btn.sec { background: #e8ecf1; color: var(--ink); }
button.ghost { background: transparent; color: var(--acc); border: 1px solid var(--line); }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--sec); outline-offset: 2px; }
input[type=text], input[type=number], input[type=date], select, textarea { font: inherit; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 10px; background: #fff; min-height: 44px; width: 100%; }
label.lab { display: block; font-weight: 600; margin: 10px 0 4px; font-size: 14px; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; background: #eef2f7; color: var(--acc);
  font-size: 12px; font-weight: 600; }
.bar { height: 10px; background: #e8ecf1; border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }
.ok { color: var(--ok); } .ko { color: var(--ko); }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; background: #eef2f7; padding: 8px; }
table.t td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
footer.app { padding: 18px 16px 30px; color: var(--muted); font-size: 12px; }
footer.app p { margin: 4px 0; }
.nascosto { display: none !important; }
.modale { position: fixed; inset: 0; background: rgba(10,15,25,.55); display: flex; align-items: center;
  justify-content: center; padding: 16px; z-index: 50; }
.modale .card { max-width: 440px; width: 100%; }
#porta { min-height: 60vh; display: flex; align-items: center; justify-content: center; }
#porta .card { max-width: 420px; width: 100%; }
@media (max-width: 520px) { header.app h1 { font-size: 21px; } main { padding: 12px; } .card { padding: 14px; } }
@media print { header.app, footer.app, button { display: none !important; } body { background: #fff; } .card { border: 0; box-shadow: none; } }

.pratica { margin: 10px 0 0; padding: 10px 12px; border-left: 5px solid var(--sec); background: #fbf6e8; font-size: 14px; }
.mazzi { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.mazzo { display: flex; flex-direction: column; gap: 4px; align-items: stretch; text-align: left; background: #fff; color: var(--ink);
  border: 1px solid var(--line); border-radius: 12px; padding: 14px; font-weight: 400; }
.mazzo strong { font-size: 17px; color: var(--acc); }
.mazzo .bar { margin-top: 6px; }
.mazzo.ripasso { border-color: var(--sec); background: #fffaf0; }
.campi { display: grid; gap: 10px 18px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); align-items: start; }
.spunta label { font-weight: 600; margin-top: 30px; } .spunta input { width: 22px; height: 22px; min-height: 0; }
.spunta p { margin: 4px 0 0; }
.pill.sec { background: #f3ecd8; color: #5a4a14; }
.punti { margin: 4px 0 0; min-height: 1.2em; }
.situazione { font-size: 18px; margin: 14px 0 6px; }
.domanda { font-size: 20px; font-weight: 700; color: var(--acc); margin: 0 0 12px; }
.opzioni { display: grid; gap: 10px; }
.opz { text-align: left; background: #fff; color: var(--ink); border: 2px solid var(--line); font-weight: 500; padding: 13px 14px; }
.opz:not(:disabled):hover { border-color: var(--acc); }
.opz.giusta, .scelti li.giusta { border-color: var(--ok); background: #e9f5ee; opacity: 1; }
.opz.sbagliata, .scelti li.sbagliata { border-color: var(--ko); background: #fbecea; opacity: 1; }
.opz:disabled { cursor: default; }
.scelti { margin: 6px 0 10px; padding-left: 0; list-style: none; counter-reset: n; min-height: 10px; }
.scelti li { counter-increment: n; border: 2px solid var(--line); border-radius: 10px; padding: 9px 12px; margin: 6px 0; background: #f6f8f4; }
.scelti li::before { content: counter(n) ". "; font-weight: 700; color: var(--acc); }
.pezzi { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.pezzo { font-weight: 600; }
.esito { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.verdetto { font-size: 20px; font-weight: 800; margin: 0 0 6px; }
.rimando { font-size: 14px; color: var(--acc); font-weight: 600; }
.medica { font-size: 14px; padding: 8px 10px; background: #fbf6e8; border-left: 4px solid var(--sec); }
.grande { font-size: 42px; font-weight: 800; color: var(--acc); margin: 4px 0; }

</style></head>
<body>
<header class="app"><div class="in"><div class="et"></div><h1></h1><div class="sub"></div></div></header>
<main><div class="in">
<section id="inizio">
  <div class="card">
    <p id="t_intro"></p>
    <p class="pratica" id="t_pratica"></p>
  </div>
  <div class="card">
    <div class="campi">
      <div><label class="lab" for="quante" id="t_quante"></label>
        <select id="quante"><option value="10" id="t_q10"></option><option value="25" id="t_q25"></option><option value="0" id="t_qtutte"></option></select></div>
      <div class="spunta"><label class="row"><input type="checkbox" id="famiglia"> <span id="t_famiglia"></span></label>
        <p class="muted" id="t_famiglia_aiuto"></p></div>
    </div>
  </div>
  <div class="card">
    <h2 id="t_scegli"></h2>
    <div class="mazzi" id="mazzi"></div>
  </div>
</section>

<section id="giro" class="nascosto">
  <div class="card">
    <div class="row"><span class="pill" id="g_mazzo"></span><span class="pill sec" id="g_scenario"></span><span class="grow"></span><span class="muted" id="g_conto"></span></div>
    <div class="bar" style="margin:10px 0 2px"><span id="g_bar"></span></div>
    <p class="muted punti" id="g_punti"></p>
    <div id="carta" data-id="">
      <p class="situazione" id="c_situazione"></p>
      <p class="domanda" id="c_domanda"></p>
      <div id="opzioni" class="opzioni"></div>
      <div id="ordine" class="nascosto">
        <p class="muted" id="t_tocca"></p>
        <ol id="scelti" class="scelti"></ol>
        <div id="pezzi" class="pezzi"></div>
        <div class="row"><button class="ghost" id="annulla_uno"></button><button id="controlla" disabled></button></div>
      </div>
    </div>
    <div id="esito" class="esito nascosto">
      <p class="verdetto" id="e_verdetto"></p>
      <p id="e_giusta"></p>
      <p id="e_spiega"></p>
      <p class="rimando" id="e_rimando"></p>
      <p class="medica nascosto" id="e_medica"></p>
      <div class="row"><button id="avanti"></button></div>
    </div>
    <div class="row" style="margin-top:12px"><button class="ghost" id="esci"></button></div>
  </div>
</section>

<section id="fine" class="nascosto">
  <div class="card">
    <h2 id="t_fine"></h2>
    <p class="grande" id="f_punti"></p>
    <p id="f_dett"></p>
    <div class="row"><button id="ancora"></button><button class="sec" id="passa"></button><button class="ghost" id="torna"></button></div>
  </div>
</section>

</div></main>
<footer class="app"><div class="in"></div></footer>
<script>
const CONFIG = {"titolo": "What Comes First? The Scenario Drill", "avvertenza": "This is practice, not a first aid course. In an emergency, call 911.", "non_affiliato": "Not affiliated with or endorsed by the U.S. Air Force or the U.S. Army.", "testi": {"etichetta": "Extra content", "per_lettori": "For readers of", "memoria": "Your progress stays on this phone or computer.", "codice_titolo": "Enter your access code", "codice_dove": "Your access code is printed in the book, at the end of Chapter 10.", "codice_etichetta": "Access code", "codice_errato": "This code doesn’t match. Check it in the book and try again.", "codice_apri": "Open", "intro": "One situation at a time: decide what you do first, or put the needs in order, then see what the book says and where to find it. Every card ends with the scenario page and the skill to open.", "pratica": "This is practice, not a first aid course. In an emergency, call 911.", "scegli": "Choose a deck", "m_campo": "In the Field", "m_campo_desc": "S00 and the field pages, S01 to S12", "m_casa": "At Home", "m_casa_desc": "S00 and the home pages, S13 to S24", "tutte": "All the scenario pages", "tutte_desc": "S00 to S24, mixed", "da_ripassare": "The ones I missed", "da_ripassare_desc": "Only the cards you got wrong the last time", "carte": "cards", "giuste_ultima": "right on your last try", "quante": "Cards per round", "q10": "10 cards", "q25": "25 cards", "qtutte": "The whole deck", "famiglia": "Family mode", "famiglia_aiuto": "Pass the phone around: the round score shows on screen. No names are saved.", "s00": "Before Any Scenario", "scenario": "Scenario", "punti_giro": "This round", "tocca": "Tap the needs in the order you would deal with them.", "annulla_uno": "Undo", "controlla": "Check my order", "giusto": "Right.", "sbagliato": "Not this time.", "ordine_giusto": "The order for this ground", "prima": "The right answer", "nel_libro": "In the book", "medica": "This is practice, not a first aid course. In an emergency, call 911.", "avanti": "Next card", "esci": "Back to the decks", "fine": "Round complete", "fine_sbagliate": "Cards to go over again", "fine_nessuna": "No cards to go over again.", "ancora": "Another round", "passa": "Pass the phone: next player", "torna": "Back to the decks"}, "id": "the-3-in-1-afr-64-4-fm-2-b1", "lingua": "en", "libro": "The 3-in-1 AFR 64-4, FM 21-76 & AFH 10-644 (SERE) Survival Manual for Home and Field", "autore": "Clayton R. Brisco", "colori": {"accento": "#3b4a2a", "secondo": "#e0a526"}, "codice_impronta": "d4a05d19"};
const DATI = {"carte": [{"id": "b00-01-001", "area": "Before Any Scenario", "scenario": "S00", "tipo": "scelta", "domanda": "The power has been out since supper, and the carbon monoxide alarm in the hall starts to sound. Upstairs, someone says they have a headache and feel dizzy.\n\nWhat do you do first?", "opzioni": ["Get everyone outside to fresh air, then call 911", "Open the book to S15 and read the first steps", "Sit the dizzy one down and check their breathing", "Open the windows wide and look for the source"], "giusta": 0, "spiegazione": "Step zero on S00 is plain: a carbon monoxide alarm, or headache, dizziness or nausea that could be carbon monoxide, means everyone outside to fresh air, call 911, then S15; opening windows, checking on someone or reading the page all keep people breathing the same air. Only once everyone is outside come the threats to life: bleeding, breathing, shock.", "rimando": "Before Any Scenario (S00) · Skill 7.4-5", "medica": true}, {"id": "b00-01-002", "area": "Before Any Scenario", "scenario": "S00", "tipo": "scelta", "domanda": "It has rained all night on your two-story house, and water is now coming in under the back door. The street outside is already covered with moving water.\n\nWhat do you do first?", "opzioni": ["Block the back door with towels and sandbags", "Take everyone into the attic and shut the hatch", "Drive the family out before the street gets worse", "Take everyone up to the higher floor"], "giusta": 3, "spiegazione": "S00 says rising water means higher ground or a higher floor, never a closed attic, and never walk, swim or drive into floodwater, so the attic hatch and the car are the two traps here. Once you are up and out of the water’s reach come the threats to life: bleeding, breathing, shock.", "rimando": "Before Any Scenario (S00) · Skill 9.4-4 · Skill 12.3-4", "medica": true}, {"id": "b00-01-003", "area": "Before Any Scenario", "scenario": "S00", "tipo": "scelta", "domanda": "Your phone and the radio both sound a tornado warning for your area. Your sturdy one-story house has no basement and no safe room.\n\nWhat do you do first?", "opzioni": ["Pack water, flashlights and the radio in a bag", "Open a few windows so the pressure can even out", "Go to a small interior room, away from windows", "Step outside to see which way it is moving"], "giusta": 2, "spiegazione": "For a tornado warning, S00 sends you to a safe room or storm shelter, or a small interior room on the lowest floor of a sturdy building, away from windows: this time safety means the middle of the house, not the yard or the glass. Once you are in that room come the threats to life: bleeding, breathing, shock.", "rimando": "Before Any Scenario (S00) · Skill 12.1-5", "medica": true}, {"id": "b00-01-004", "area": "Before Any Scenario", "scenario": "S00", "tipo": "scelta", "domanda": "You are in the kitchen after supper when the floor starts to roll and plates slide off the shelf. The shaking keeps going.\n\nWhat do you do first?", "opzioni": ["Stand in the kitchen doorway and brace yourself", "Drop, Cover, and Hold On until it stops", "Run out the back door before anything falls", "Hurry to the next room to check on the kids"], "giusta": 1, "spiegazione": "S00 says shaking means Drop, Cover, and Hold On until it stops, and 12.5-4 warns against running outside or into a doorway while it shakes; crossing the house now is the danger. When the shaking stops come the threats to life: bleeding, breathing, shock.", "rimando": "Before Any Scenario (S00) · Skill 12.5-4", "medica": true}, {"id": "b00-01-005", "area": "Before Any Scenario", "scenario": "S00", "tipo": "scelta", "domanda": "Your county sends a phone alert: an evacuation order for your neighborhood, starting now. The sky over your street still looks calm.\n\nWhat do you do first?", "opzioni": ["Tape a note for the family inside the front door", "Watch the news a while to see how bad it gets", "Leave now, the way officials tell you to", "Hold the big decision until the first shock passes"], "giusta": 2, "spiegazione": "S00 says that when officials say leave, or stay inside, you do it now; 3.1-2 makes an official order the one thing you don’t put off, and 9.4-4 says to leave a note only if there’s time. Once you are on your way come the threats to life: bleeding, breathing, shock.", "rimando": "Before Any Scenario (S00) · Skill 3.1-2", "medica": true}, {"id": "fld-01-001", "area": "In the Field", "scenario": "S01", "tipo": "scelta", "domanda": "You took a side path on a day hike, and now the trail is gone. Nobody is hurt, and there are hours of daylight left.\n\nWhat do you do first?", "opzioni": ["Head downhill and follow the first stream", "Climb the nearest ridge to try to spot the trail", "Walk back the way you think you came in", "Stay where you are instead of looking for the trail"], "giusta": 3, "spiegazione": "S01’s step zero: “Stay where you are, unless staying puts your life in immediate danger.” Setting off to find the trail feels useful, but moving makes you harder to find.", "rimando": "Scenario S01 · Skill 10.1-1", "medica": false}, {"id": "fld-01-002", "area": "In the Field", "scenario": "S01", "tipo": "scelta", "domanda": "You’re lost, nobody is hurt, and you’ve decided to stay put. Your phone shows one bar, but a voice call won’t go through.\n\nWhat do you do first?", "opzioni": ["Switch on your personal locator beacon right away", "Text 911, and say where you are first", "Walk uphill until you find a stronger signal", "Turn the phone off and save it for later"], "giusta": 1, "spiegazione": "S01, step 3: with no voice call, text 911 where it works, and “say where you are first.” The beacon is “only in grave and imminent danger,” and walking off for a signal breaks the stay-put rule.", "rimando": "Scenario S01 · Skill 4.1-2", "medica": false}, {"id": "fld-01-003", "area": "In the Field", "scenario": "S01", "tipo": "scelta", "domanda": "It’s mid-afternoon in late October, you’re lost, and you’ve sent your text. The air is already cooling.\n\nWhat comes next?", "opzioni": ["Start your shelter now, with what’s already there", "Go look for something to eat while it’s light", "Lay out your signals first, then think about shelter", "Wait until dusk to see whether anyone comes"], "giusta": 0, "spiegazione": "S01, step 4: “Start on shelter early: late afternoon leaves poor materials and little time.” On this ground signals come after shelter and water, and food comes last.", "rimando": "Scenario S01 · Skill 6.1-4", "medica": false}, {"id": "fld-01-004", "area": "In the Field", "scenario": "S01", "tipo": "ordine", "domanda": "You’re lost in the woods on a cool fall afternoon, and nobody is hurt. Nobody will miss you until tonight.\n\nAfter step zero, put these needs in order for this ground.", "opzioni": ["First aid → Shelter and warmth → Water → Signals → Food", "First aid → Signals → Shelter and warmth → Water → Food", "First aid → Water → Shelter and warmth → Signals → Food", "Shelter and warmth → First aid → Water → Signals → Food"], "giusta": 0, "spiegazione": "S01’s order on a cool day: “First aid · shelter and warmth · water · signals · food last.” First aid always leads; putting water ahead of shelter fits the heat, not a cool fall evening.", "rimando": "Scenario S01 · Skill 6.1-4", "medica": false}, {"id": "fld-01-005", "area": "In the Field", "scenario": "S01", "tipo": "scelta", "domanda": "You’re lost in open, dry country on a hot July afternoon. Nobody is hurt, and you have two bottles of water.\n\nAfter first aid, which need do you put first?", "opzioni": ["Shelter and warmth", "Signals in threes", "A fire for the night", "Water and shade"], "giusta": 3, "spiegazione": "S01: “In the heat, water and shade come first.” On a cool day shelter and warmth would lead: the needs stay the same, but the order follows the ground.", "rimando": "Scenario S01 · Skill 8.1-2", "medica": false}, {"id": "fld-01-006", "area": "In the Field", "scenario": "S02", "tipo": "scelta", "domanda": "The sun is setting, and you’re still two hours from the trailhead. You have a headlamp, and you’re tempted to push on.\n\nWhat do you do first?", "opzioni": ["Jog the easy stretch before it gets fully dark", "Keep walking by headlamp while you still have energy", "Stop here; don’t walk on into the dark", "Follow the stream downhill toward the road"], "giusta": 2, "spiegazione": "S02’s step zero: “Don’t walk on into the dark.” A headlamp feels like enough, but 10.1-3 says to stop early, with daylight left for shelter.", "rimando": "Scenario S02 · Skill 10.1-3", "medica": false}, {"id": "fld-01-007", "area": "In the Field", "scenario": "S02", "tipo": "scelta", "domanda": "You’ve stopped for the night in a pine forest. The flattest spot nearby is a dry, sandy streambed under a big dead tree.\n\nWhere do you camp?", "opzioni": ["Right against the dead tree, out of the wind", "Clear of the streambed and the dead tree", "In the streambed, but well away from the tree", "In the streambed, where the sand is soft and flat"], "giusta": 1, "spiegazione": "S02’s step zero: camp clear of dead trees and branches and of dry streambeds. Flat sand is the trap: 6.1-2 says to avoid a dry streambed “however flat and sandy.”", "rimando": "Scenario S02 · Skill 6.1-2", "medica": false}, {"id": "fld-01-008", "area": "In the Field", "scenario": "S02", "tipo": "scelta", "domanda": "You’ve picked a safe spot with an hour of light left, and you carry a tarp. The wind and rain are coming from one side only.\n\nWhat do you do first?", "opzioni": ["Fill and treat your water while you can still see", "Pitch a lean-to with its back to the wind", "Lay a signal fire out in the open first", "Light a small fire before you build anything else"], "giusta": 1, "spiegazione": "S02, steps 1 and 2: “Start your shelter now, while there is light,” and with a tarp, a lean-to when wind and rain come from one side. Fire, water and signals all come later in the steps.", "rimando": "Scenario S02 · Skill 6.2-2", "medica": false}, {"id": "fld-01-009", "area": "In the Field", "scenario": "S02", "tipo": "scelta", "domanda": "Your lean-to is up, and the ground under it is cold and damp. You have no pad, but fir boughs and dry leaves are all around.\n\nWhat comes next?", "opzioni": ["Build a bough bed at least 12 inches thick", "Skip the bed and sit up by a fire all night", "Light a small fire right under the tarp’s edge", "Spread a thin layer of leaves and save your energy"], "giusta": 0, "spiegazione": "S02, step 3: “Insulation under you first. A bed of boughs or leaves: at least 12 inches thick, because it flattens.” A thin layer packs flat, and a flame never goes under the tarp.", "rimando": "Scenario S02 · Skill 6.3-1", "medica": false}, {"id": "fld-01-010", "area": "In the Field", "scenario": "S02", "tipo": "ordine", "domanda": "Night is coming on in the mountains, and the forecast says near freezing. Nobody is hurt, and you have a lighter and a tarp.\n\nAfter step zero, put these needs in order for this ground.", "opzioni": ["First aid → Water → Warmth: shelter, bed, fire → Signals → Food", "Warmth: shelter, bed, fire → First aid → Water → Signals → Food", "First aid → Signals → Warmth: shelter, bed, fire → Water → Food", "First aid → Warmth: shelter, bed, fire → Water → Signals → Food"], "giusta": 3, "spiegazione": "S02’s order: “First aid · warmth: shelter, bed, fire · water · signals · food last.” First aid stays on top even when nobody seems hurt; on a cold night warmth comes next, ahead of water.", "rimando": "Scenario S02 · Skill 6.2-1", "medica": false}, {"id": "fld-01-011", "area": "In the Field", "scenario": "S03", "tipo": "scelta", "domanda": "A cold rain has soaked your friend on an exposed ridge, and a hard wind is blowing. He’s shivering, and his hands fumble with his zipper.\n\nWhat do you do first?", "opzioni": ["Give him a hot drink from your thermos", "Have him jog in place until he warms up", "Get him out of the wind and the wet", "Build a fire right there on the open ridge"], "giusta": 2, "spiegazione": "S03’s step zero: “Get out of the wind and the wet.” A warm drink comes later, and 4.3-2 says to let a cold person do as little as possible.", "rimando": "Scenario S03 · Skill 4.3-2", "medica": true}, {"id": "fld-01-012", "area": "In the Field", "scenario": "S03", "tipo": "scelta", "domanda": "You’ve got your hiking partner under a rock overhang, out of the rain. Now she’s slurring her words and seems drowsy.\n\nWhat do you do first?", "opzioni": ["Let her sleep; rest will bring her around", "Hurry her down the trail to the car", "Call 911, and keep warming her", "Wait to see if she starts to improve"], "giusta": 2, "spiegazione": "S03’s step zero: “Confusion, slurred speech or drowsiness: call 911, and keep warming them.” 4.3-1 calls these signs serious, so waiting for her to improve is the wrong call.", "rimando": "Scenario S03 · Skill 4.3-1", "medica": true}, {"id": "fld-01-013", "area": "In the Field", "scenario": "S03", "tipo": "scelta", "domanda": "An hour ago your friend was shivering hard, soaked and cold. Now the shivering has stopped, he’s still cold, and he says he’s fine.\n\nWhat do you do now?", "opzioni": ["Keep rewarming him; this is not a good sign", "Let him pack up and hike out now", "Take it as a sign he has warmed up", "Stop rewarming and let him rest"], "giusta": 0, "spiegazione": "S03’s step zero: “Shivering that stops while they are still cold: don’t take it as a good sign.” Stopping the rewarming or hiking out now treats a warning as good news.", "rimando": "Scenario S03 · Skill 4.3-1", "medica": true}, {"id": "fld-01-014", "area": "In the Field", "scenario": "S03", "tipo": "scelta", "domanda": "Your shivering partner is in dry layers inside your small tent. You want to warm the tent with your camp stove.\n\nWhat do you do?", "opzioni": ["Run it for just ten minutes at a time", "Never run the camp stove inside the tent", "Run the stove with the tent door cracked open", "Set the stove just inside the doorway"], "giusta": 1, "spiegazione": "The carbon monoxide note on S03: “Never run a generator, grill or camp stove inside a home, garage, tent or vehicle.” You cannot see or smell it, so a cracked door or a short burn doesn’t make it safe.", "rimando": "Scenario S03 · Skill 7.4-1", "medica": true}, {"id": "fld-01-015", "area": "In the Field", "scenario": "S03", "tipo": "ordine", "domanda": "You’re soaked, cold and shivering at dusk, miles from the car. You have dry layers in your pack and a way to make fire.\n\nAfter step zero, put these needs in order for this ground.", "opzioni": ["First aid for the cold → Water → Shelter and fire → Food", "Shelter and fire → First aid for the cold → Water → Food", "Water → First aid for the cold → Shelter and fire → Food", "First aid for the cold → Shelter and fire → Water → Food"], "giusta": 3, "spiegazione": "S03’s order: “First aid for the cold · shelter and fire · water · food last.” Dry layers and insulation come before you build, and water waits until shelter and fire are going.", "rimando": "Scenario S03 · Skill 4.3-2", "medica": true}, {"id": "fld-01-016", "area": "In the Field", "scenario": "S04", "tipo": "scelta", "domanda": "On a forest road after a storm, a hiker lies still beside a downed power line. You can’t tell whether the line is live.\n\nWhat do you do first?", "opzioni": ["Drag him clear of the line by his boots", "Run to him and check whether he’s breathing", "Stay 20 feet away and call 911 from there", "Push the line away from him with a dry stick"], "giusta": 2, "spiegazione": "S04’s step zero: “Make the scene safe before you touch them… If you can’t, stay out.” 4.1-1 says to stay 20 feet from a downed line and call 911 from a safe place.", "rimando": "Scenario S04 · Skill 4.1-1", "medica": true}, {"id": "fld-01-017", "area": "In the Field", "scenario": "S04", "tipo": "scelta", "domanda": "Your friend broke his leg on a remote trail; he’s awake, breathing normally and not bleeding. Your phone shows no voice signal.\n\nWhat do you do first?", "opzioni": ["Text 911 where it works, and keep trying", "Carry him between you toward the trailhead", "Send the two fittest hikers out for help", "Splint the leg before you do anything else"], "giusta": 0, "spiegazione": "S04, step 1: “Call 911. No voice call: text it where it works… Keep trying.” Sending two people out comes only when there is no way to call and nobody knows where you are.", "rimando": "Scenario S04 · Skill 4.1-2", "medica": true}, {"id": "fld-01-018", "area": "In the Field", "scenario": "S04", "tipo": "scelta", "domanda": "After a bad fall, your friend is pale, cold and clammy, with a fast, weak pulse. He begs you for a drink of water.\n\nWhat do you do?", "opzioni": ["Sit him up so he can drink", "Give him small sips of water", "Give him a sports drink, slowly", "Give him nothing to eat or drink"], "giusta": 3, "spiegazione": "S04, step 3: shock means “nothing to eat or drink, even for thirst.” The old manuals gave sips of water; MedlinePlus, which the book follows, advises nothing by mouth.", "rimando": "Scenario S04 · Skill 4.1-12", "medica": true}, {"id": "fld-01-019", "area": "In the Field", "scenario": "S04", "tipo": "scelta", "domanda": "Your partner fell from a ledge onto cold, rocky ground and says his neck hurts. The spot is safe, and help has been called.\n\nWhat do you do first?", "opzioni": ["Help him over to a flatter, softer spot", "Hold his head and neck still, as found", "Sit him up so he can breathe more easily", "Roll him onto your pad, off the cold ground"], "giusta": 1, "spiegazione": "S04, step 2: if the neck or back may be hurt, “hold the head and neck still, as found.” Something goes under him only without moving the head or neck.", "rimando": "Scenario S04 · Skill 4.2-9", "medica": true}, {"id": "fld-01-020", "area": "In the Field", "scenario": "S04", "tipo": "ordine", "domanda": "Your friend is badly hurt on a remote trail, and the evening is turning cold. You’ve texted 911, but no reply has come.\n\nAfter step zero, put these needs in order for this ground.", "opzioni": ["Signals → Threats to life → Warmth: cover and insulation → Food", "Warmth: cover and insulation → Threats to life → Signals → Food", "Threats to life → Warmth: cover and insulation → Signals → Food", "Threats to life → Signals → Warmth: cover and insulation → Food"], "giusta": 2, "spiegazione": "S04’s order: “Threats to life (S00) · warmth: cover and insulation · signals · food last.” Bleeding and breathing come before anything else, and keeping them warm comes before laying out the X.", "rimando": "Scenario S04 · Skill 4.1-12", "medica": true}, {"id": "fld-01-021", "area": "In the Field", "scenario": "S05", "tipo": "scelta", "domanda": "On a hot, dry trail, your brother starts talking nonsense, then slumps against a rock. You’re almost out of water.\n\nWhat do you do first?", "opzioni": ["Call 911 and cool him at once, where he is", "Help him walk back toward the car before you call", "Leave him in the shade and go find water", "Wait to see whether he starts sweating again"], "giusta": 0, "spiegazione": "S05’s step zero: “Confusion, slurred speech or collapse in the heat: call 911, and cool them at once, where they are.” Walking him to the car or leaving to find water delays the cooling the page puts first.", "rimando": "Scenario S05 · Skill 4.3-5", "medica": true}, {"id": "fld-01-022", "area": "In the Field", "scenario": "S05", "tipo": "scelta", "domanda": "You and a friend have one quart of water left, and the nearest spring is hours away. You’re tempted to save it all for tomorrow.\n\nWhat do you do?", "opzioni": ["Save it for later, when the heat peaks", "Keep it for whoever gets sick first", "Drink nothing until the sun goes down", "Drink what you have, a little and often"], "giusta": 3, "spiegazione": "S05, step 2: “Drink what you have, a little and often. Don’t keep it ‘for later.’” Cut your sweating with shade and slow work, not your drinking.", "rimando": "Scenario S05 · Skill 12.3-3", "medica": false}, {"id": "fld-01-023", "area": "In the Field", "scenario": "S05", "tipo": "scelta", "domanda": "At dusk you find a slow trickle of clear water at about 3,000 feet. You have a pot and a small stove.\n\nHow do you make it safe to drink?", "opzioni": ["Heat it until the first small bubbles show", "Bring it to a rolling boil for 1 minute", "Drink it as is, since it’s running clear", "Strain it through a clean bandanna, then drink it"], "giusta": 1, "spiegazione": "S05, step 7: “Boil 1 minute, or 3 minutes above 5,000 feet.” Clear water can still carry germs, a cloth alone doesn’t make it safe, and 8.3-3 says not to count from the first small bubbles.", "rimando": "Scenario S05 · Skill 8.3-3", "medica": false}, {"id": "fld-01-024", "area": "In the Field", "scenario": "S05", "tipo": "ordine", "domanda": "You’re out of water on a hot, dry trail, with a long afternoon ahead. Nobody is sick yet.\n\nAfter step zero, put these needs in order for this ground.", "opzioni": ["Water and shade → First aid → Shelter for the night → Food", "First aid → Water and shade → Shelter for the night → Food", "First aid → Shelter for the night → Water and shade → Food", "First aid → Water and shade → Food → Shelter for the night"], "giusta": 1, "spiegazione": "S05’s order in the heat: “First aid · water and shade · shelter for the night · food last.” First aid still leads, and food stays last: eating makes you thirstier.", "rimando": "Scenario S05 · Skill 8.1-2", "medica": false}, {"id": "fld-01-025", "area": "In the Field", "scenario": "S05", "tipo": "ordine", "domanda": "Your bottles ran dry on a late-fall hike, and a cold wind is rising with the dusk. Nobody is hurt.\n\nAfter step zero, put these needs in order for this ground.", "opzioni": ["Water → First aid → Warmth → Food", "Warmth → First aid → Water → Food", "First aid → Warmth → Water → Food", "First aid → Water → Warmth → Food"], "giusta": 2, "spiegazione": "S05: “In the cold, warmth comes before water.” Running dry feels like the first problem, but on cold ground warmth moves ahead of it; first aid still leads and food stays last.", "rimando": "Scenario S05 · Skill 8.1-2", "medica": false}, {"id": "fld-01-026", "area": "In the Field", "scenario": "S06", "tipo": "scelta", "domanda": "You’re eating lunch at a trailside picnic table, your truck parked 200 yards away. Thunder rumbles, but no rain has fallen yet.\n\nWhat do you do first?", "opzioni": ["Get in the hard-topped truck at once", "Finish lunch under the big shade tree", "Wait until the rain starts, then go", "Crouch low with your feet together"], "giusta": 0, "spiegazione": "S06’s step zero: “At the first thunder, get inside a building or a hard-topped vehicle at once.” Don’t wait for the rain; the National Weather Service, which the book follows, calls the lightning crouch a myth.", "rimando": "Scenario S06 · Skill 12.1-4", "medica": false}, {"id": "fld-01-027", "area": "In the Field", "scenario": "S06", "tipo": "scelta", "domanda": "You’re lost off the trail and staying put, as S01 says. Thunder rumbles over the ridge behind you.\n\nWhich page do you open first?", "opzioni": ["S12 · Searchers or an Aircraft Nearby", "S01 · Lost or Off the Trail", "S02 · Night Coming On, No Shelter", "S06 · Thunderstorm, Caught in the Open"], "giusta": 3, "spiegazione": "The index rule: “If two scenarios fit, start with the one that threatens first.” S01’s own step zero says where that is: “Thunder: S06.”", "rimando": "Scenario S06 · Skill 12.1-4", "medica": false}, {"id": "fld-01-028", "area": "In the Field", "scenario": "S06", "tipo": "scelta", "domanda": "You’ve been waiting to be found on an open hilltop, where you set your signals. A storm moves in, and there’s no building or vehicle for miles.\n\nWhat do you do first?", "opzioni": ["Stay by your signals so searchers can see you", "Lie flat on the ground until it passes", "Shelter under the lone pine at the top", "Leave the hilltop and your high signal spot"], "giusta": 3, "spiegazione": "S06, step 2: caught in the open, you only lower the risk, so “leave hilltops, ridges and open fields, and the high spot where you set your signals.” Lone trees are out, and you never lie flat.", "rimando": "Scenario S06 · Skill 12.1-4", "medica": false}, {"id": "fld-01-030", "area": "In the Field", "scenario": "S06", "tipo": "ordine", "domanda": "It’s been 30 minutes since the last thunder, and your group is soaked and chilled. One friend has a burned hand from a nearby strike.\n\nAfter step zero, put these needs in order for this ground.", "opzioni": ["Warmth: dry clothes → First aid → Food", "First aid → Warmth: dry clothes → Food", "Warmth: dry clothes → Food → First aid", "First aid → Food → Warmth: dry clothes"], "giusta": 1, "spiegazione": "S06’s order: “First aid · warmth: dry clothes once it passes · food last.” The burned hand comes first; then everyone changes out of wet clothes before they feel cold (5.1-2).", "rimando": "Scenario S06 · Skill 5.1-2", "medica": true}, {"id": "fld-02-001", "area": "In the Field", "scenario": "S07", "tipo": "scelta", "domanda": "Your car is stuck in a drift on a back road, and snow has piled up behind it. The car is getting cold, and you want to run the engine for heat.\n\nWhat do you do first?", "opzioni": ["Clear the snow away from the exhaust pipe", "Start the engine and run it until it’s warm", "Crack a window, then start the engine", "Light a small fire beside the car"], "giusta": 0, "spiegazione": "S07’s step zero: “Clear snow from the exhaust pipe before you start the engine, and keep it clear.” A cracked window comes with the engine only once the pipe is clear, and the page says never light a fire in or near the vehicle.", "rimando": "Scenario S07 · Skill 12.2-2", "medica": true}, {"id": "fld-02-002", "area": "In the Field", "scenario": "S07", "tipo": "scelta", "domanda": "A blizzard pushes your car into a ditch on a rural highway, and nobody is hurt. You passed a gas station about two miles back.\n\nWhat do you do first?", "opzioni": ["Walk to the nearest house you can see", "Walk back to the gas station before dark", "Stay in the car: it’s your shelter", "Stand by the road to flag down a driver"], "giusta": 2, "spiegazione": "S07, step 1: “Stay in the vehicle: it is shelter, and from the air easier to spot than a person on foot.” Walking off into the storm, even toward help you know is there, is what 12.2-2 tells you to avoid.", "rimando": "Scenario S07 · Skill 12.2-2", "medica": false}, {"id": "fld-02-003", "area": "In the Field", "scenario": "S07", "tipo": "scelta", "domanda": "You’re snowbound in your car, running the engine now and then with a window cracked. Your wife says she has a headache and feels dizzy and sick to her stomach.\n\nWhat do you do first?", "opzioni": ["Give her water and let her lie down", "Get everyone out of the car to fresh air", "Turn the heater up; she may be chilled", "Open the window wider and keep the engine on"], "giusta": 1, "spiegazione": "S07, step 3: “Headache, dizziness or nausea: everyone out to fresh air.” You cannot see or smell carbon monoxide, and its signs feel like the flu, so get out first, then call 911.", "rimando": "Scenario S07 · Skill 7.4-5", "medica": true}, {"id": "fld-02-004", "area": "In the Field", "scenario": "S07", "tipo": "ordine", "domanda": "Your car is stuck in deep snow on a back road at night, and you’ve dug out the exhaust pipe. The kit holds water and blankets, but no food at all.\n\nAfter step zero, put these needs in order for this ground.", "opzioni": ["First aid → Safe air → Being seen → Warmth in the vehicle → Water", "First aid → Warmth in the vehicle → Safe air → Being seen → Water", "First aid → Water → Safe air → Warmth in the vehicle → Being seen", "First aid → Safe air → Warmth in the vehicle → Being seen → Water"], "giusta": 3, "spiegazione": "S07’s order: “First aid · safe air · warmth in the vehicle · being seen · water · food last.” In snow, safe air comes before you warm the car with the engine, and water comes after being seen; in desert heat, water moves up to second (S08).", "rimando": "Scenario S07 · Skill 6.2-8", "medica": false}, {"id": "fld-02-005", "area": "In the Field", "scenario": "S07", "tipo": "scelta", "domanda": "You’ve been stuck in the car for a day, and the water in your kit is gone. Clean snow is piled up to the windows.\n\nWhat do you do?", "opzioni": ["Skip drinking until the plow or help arrives", "Eat the clean snow right off the top of the drift", "Melt it in a bag inside your layers; treat it", "Melt it in a bag held against your bare belly"], "giusta": 2, "spiegazione": "S07, step 7: “Never eat snow unmelted: melt it in a waterproof bag between your layers, never on skin, and treat it.” Snow eaten as it is chills and dehydrates you, and snow is not pure (8.2-4).", "rimando": "Scenario S07 · Skill 8.2-4", "medica": false}, {"id": "fld-02-006", "area": "In the Field", "scenario": "S08", "tipo": "scelta", "domanda": "Your car breaks down on a remote desert road at midday, and the air conditioning dies with it. Your elderly father wants to rest inside with the windows up.\n\nWhat do you do first?", "opzioni": ["Get him out of the closed car right away", "Walk for help while he waits in the car", "Crack the windows and let him nap inside", "Let him rest inside while you call for help"], "giusta": 0, "spiegazione": "S08’s step zero: “Never leave anyone in a closed car: it becomes an oven.” Cracked windows don’t change that; the shade goes beside the car, not inside it (step 3).", "rimando": "Scenario S08 · Skill 12.3-2", "medica": true}, {"id": "fld-02-007", "area": "In the Field", "scenario": "S08", "tipo": "scelta", "domanda": "You’re stranded with your car in open desert, and you’ve already called 911. The sun is high, and you have a tarp and some cord.\n\nWhat do you do first?", "opzioni": ["Drape the tarp over the car and wait inside", "Walk toward the hills to look for shade", "Rig the tarp as shade beside the car", "Sit in the car with all the doors open"], "giusta": 2, "spiegazione": "S08, step 3: “Rig shade beside the car, not inside it,” with the tarp 12 to 18 inches above you and a pack or branches under you. A parked car becomes an oven, and walking off in the midday heat goes against steps 1 and 7.", "rimando": "Scenario S08 · Skill 6.2-8 · Skill 6.3-6", "medica": false}, {"id": "fld-02-008", "area": "In the Field", "scenario": "S08", "tipo": "scelta", "domanda": "You and your son are stranded with the car on a hot desert road, with less than a quart of water between you. You’re hungry, and the kit holds crackers and jerky.\n\nWhat do you do?", "opzioni": ["Eat the jerky to keep your strength up", "Eat the crackers now and save all the water", "Eat now, then drink to wash it down", "Eat little or nothing while water is short"], "giusta": 3, "spiegazione": "S08, step 5: “Drink what you have, a little and often. Water short: eat little or nothing.” Eating makes you thirstier, and dry, salty food such as crackers and jerky is what 11.1-2 tells you to skip.", "rimando": "Scenario S08 · Skill 12.3-3", "medica": false}, {"id": "fld-02-010", "area": "In the Field", "scenario": "S08", "tipo": "scelta", "domanda": "It’s your second day with the stranded car in the desert, and no one has answered your calls. You decide you have a real reason to walk out to the highway.\n\nWhat do you do first?", "opzioni": ["Leave a note and go in the cool hours", "Take all the water and go without leaving word", "Set out at once, even in the heat of midday", "Walk on through the whole afternoon to make time"], "giusta": 0, "spiegazione": "S08, step 7: “Move only for a real reason, in the cool hours, and leave a note.” Rest in shade through the heat of the day (12.3-1); the note says when you left, where to and by what route (9.3-1).", "rimando": "Scenario S08 · Skill 12.3-1 · Skill 9.3-1", "medica": false}, {"id": "fld-02-011", "area": "In the Field", "scenario": "S09", "tipo": "scelta", "domanda": "You’re crossing a frozen pond when the ice gives way and you drop in up to your chest. The cold takes your breath, and you’re gasping hard.\n\nWhat do you do first?", "opzioni": ["Haul yourself out on the nearest edge", "Keep your head up and control your breathing", "Swim hard for the closest bank", "Kick off your heavy boots and your winter coat"], "giusta": 1, "spiegazione": "S09’s step zero: “The first minute: cold shock grabs your breath. Keep your head up and get your breathing under control.” Only then, for about 10 more minutes, do your arms work to get you out, and your winter clothes stay on: they help you float.", "rimando": "Scenario S09 · Skill 12.4-1", "medica": true}, {"id": "fld-02-012", "area": "In the Field", "scenario": "S09", "tipo": "scelta", "domanda": "You’ve fallen through the ice, and after the first minute your breathing has settled. The far shore looks closer than the way you walked out.\n\nWhat comes next?", "opzioni": ["Head for the edge nearest the far shore", "Take off your coat so you can climb", "Turn back toward the way you came", "Stay still and wait in the water for help"], "giusta": 2, "spiegazione": "S09, step 2: “Turn back toward the way you came: that is probably the strongest ice.” Put your arms on the solid edge, dig in the picks and kick; your winter clothes stay on, because they help you float.", "rimando": "Scenario S09 · Skill 12.4-3", "medica": false}, {"id": "fld-02-013", "area": "In the Field", "scenario": "S09", "tipo": "scelta", "domanda": "You’ve kicked and clawed your way up onto the ice, soaked and shaking. The hole is right behind your feet.\n\nWhat do you do first?", "opzioni": ["Take off your wet coat right there", "Lie flat and roll away from the hole", "Kneel at the edge to catch your breath", "Stand up and walk back the way you came"], "giusta": 1, "spiegazione": "S09, step 3: “Lie flat and roll away from the hole. Don’t stand up next to it.” Once you are clear: a warm, dry shelter, dry layers for wet clothes, and medical help now (step 7).", "rimando": "Scenario S09 · Skill 12.4-3", "medica": false}, {"id": "fld-02-014", "area": "In the Field", "scenario": "S09", "tipo": "scelta", "domanda": "Your friend breaks through the ice about 30 feet out from the bank where you stand. There’s a rope in your truck nearby.\n\nWhat do you do first?", "opzioni": ["Run out to the hole and grab his arm", "Crawl out on your belly to reach him", "Tell him to shed his heavy winter coat", "Call 911, and stay off the ice"], "giusta": 3, "spiegazione": "S09’s step zero: “Someone else went in: call 911 and stay off the ice; reach or throw from shore.” Going out to the hole likely puts two of you in the water (12.4-7), and his winter clothes help him float.", "rimando": "Scenario S09 · Skill 12.4-7", "medica": false}, {"id": "fld-02-016", "area": "In the Field", "scenario": "S10", "tipo": "scelta", "domanda": "In early June, your trail crosses a creek running high with snowmelt. It looks only knee-deep, and the far bank is close.\n\nWhat do you do first?", "opzioni": ["Don’t wade it; wait, or go around", "Swim it, then change into dry clothes", "Wade across fast, before the cold can set in", "Take your boots off and wade across quickly"], "giusta": 0, "spiegazione": "S10’s step zero: “Very cold water or snowmelt: don’t wade or swim.” Knee-deep looks easy, but the book’s rule is plain: no safe place to cross, don’t cross (10.4-5).", "rimando": "Scenario S10 · Skill 10.4-5", "medica": false}, {"id": "fld-02-017", "area": "In the Field", "scenario": "S10", "tipo": "scelta", "domanda": "On a warm August day, a knee-deep river blocks your route, and you climb a rise to study it. You see rock ledges, a deep eddy, a fallen tree across the water, and a flat stretch split into channels.\n\nWhere do you cross?", "opzioni": ["In the calm water of the eddy", "On the fallen tree, as a bridge", "At the flat stretch split into channels", "Along the rock ledges, where it narrows"], "giusta": 2, "spiegazione": "S10, step 1: good is “a flat stretch split into channels, or the stretch just upstream of a sandbar”; bad is “rock ledges, river mouths, eddies, fallen trees, waterfalls.” The calm eddy and the handy log are both on the list to skip.", "rimando": "Scenario S10 · Skill 10.4-5", "medica": false}, {"id": "fld-02-018", "area": "In the Field", "scenario": "S10", "tipo": "scelta", "domanda": "You’ve picked a safe crossing on a warm river, and the far bank is low and easy to climb. You have a sturdy pole, and your pack is strapped on tight.\n\nWhat do you do before you step in?", "opzioni": ["Take your boots off to keep them dry", "Loosen your pack so you can slip out", "Cinch the pack straps tighter for balance", "Tie the pack to your waist with cord"], "giusta": 1, "spiegazione": "S10, step 3: “Keep your boots on; loosen your pack so you can slip out at once.” If you go down, you need to be free of the pack at once, and wading barefoot is on the list to avoid (10.4-6).", "rimando": "Scenario S10 · Skill 10.4-6", "medica": false}, {"id": "fld-02-019", "area": "In the Field", "scenario": "S10", "tipo": "scelta", "domanda": "Halfway across a summer river, the current knocks you off your feet. You’re carried into a stretch of shallow rapids.\n\nWhat do you do first?", "opzioni": ["On your back, feet downstream and up", "Stand up at once and plant your feet", "Swim hard upstream, against the current", "Roll onto your belly, head downstream"], "giusta": 0, "spiegazione": "S10, step 6: in shallow rapids, “on your back, feet downstream and up.” Don’t fight the current, and never stand up in fast water: a trapped foot lets the current hold you under (10.4-8).", "rimando": "Scenario S10 · Skill 10.4-8", "medica": false}, {"id": "fld-02-020", "area": "In the Field", "scenario": "S10", "tipo": "ordine", "domanda": "A cold, fast river blocks your way back late on an October afternoon. Your friend slipped on the rocky bank and cut his hand.\n\nAfter step zero, put these needs in order for this ground.", "opzioni": ["Warmth: no wading in cold water → Food → First aid", "Warmth: no wading in cold water → First aid → Food", "First aid → Food → Warmth: no wading in cold water", "First aid → Warmth: no wading in cold water → Food"], "giusta": 3, "spiegazione": "S10’s order: “First aid · warmth: no wading in cold water · food last.” The cut hand comes first; then you stay warm by staying out of the cold river, and food waits until last.", "rimando": "Scenario S10 · Skill 10.4-5", "medica": true}, {"id": "fld-02-021", "area": "In the Field", "scenario": "S11", "tipo": "scelta", "domanda": "A squall swamps your small fishing boat on a lake, and it starts to fill with water. Your life jacket is stowed under the seat.\n\nWhat do you do first?", "opzioni": ["Bail out the water with the bait bucket", "Call for help on your phone first", "Swim for the shore while it’s close", "Put your life jacket on right now"], "giusta": 3, "spiegazione": "S11’s step zero: “Get a life jacket on, if it is not on already.” The Coast Guard advises a life jacket worn, not just carried (12.4-1); the call for help comes at step 5.", "rimando": "Scenario S11 · Skill 12.4-1", "medica": false}, {"id": "fld-02-022", "area": "In the Field", "scenario": "S11", "tipo": "scelta", "domanda": "Your canoe flips on a cold lake, and you’ve got your breathing back under control. The canoe floats upside down beside you, and the shore looks close.\n\nWhat do you do first?", "opzioni": ["Let the canoe go and float where you are", "Get onto the canoe and stay with it", "Shed your jacket so you can swim better", "Swim for shore while you’re still strong"], "giusta": 1, "spiegazione": "S11, step 1: “While your arms still work, for about 10 minutes, get in or on the boat: it will likely float. Stay with it.” Don’t swim for a shore that looks close, and keep your clothes on.", "rimando": "Scenario S11 · Skill 12.4-1", "medica": false}, {"id": "fld-02-023", "area": "In the Field", "scenario": "S11", "tipo": "scelta", "domanda": "Your boat has sunk, and the three of you float in cold water in life jackets, breathing steady again. There is nothing left to climb onto.\n\nWhat do you do first?", "opzioni": ["Huddle close together and keep still", "Swim together for the nearest shore", "Spread out so a boat can spot you", "Kick hard and keep moving to stay warm"], "giusta": 0, "spiegazione": "S11, step 3: “Stuck in the water in a life jacket: keep still, knees to chest; a group huddles.” Don’t swim for shore, and spreading out is the lightning rule (S06), not the cold-water one.", "rimando": "Scenario S11 · Skill 12.4-1", "medica": true}, {"id": "fld-02-024", "area": "In the Field", "scenario": "S11", "tipo": "scelta", "domanda": "You’ve been adrift for a day in a small boat, and the drinking water is gone. Rain starts to fall, and spray blows in over the side.\n\nWhat do you do?", "opzioni": ["Wait for calmer weather before you catch any", "Keep every drop you catch, sea spray and all", "Catch it in a rinsed sheet; pour out any salty water", "Stretch the rain you catch with a little seawater"], "giusta": 2, "spiegazione": "S11, step 7: “Catch rain in a rinsed sheet, and pour out any mixed with sea spray. Never drink seawater.” Rinsing takes dyes and oils off the sheet, and while it rains you fill every container (8.2-2).", "rimando": "Scenario S11 · Skill 8.2-2", "medica": false}, {"id": "fld-02-025", "area": "In the Field", "scenario": "S11", "tipo": "ordine", "domanda": "Your motor dies far from shore, and your small boat drifts on a cold, windy lake. Everyone is aboard, dry and in a life jacket, and one friend has a cut hand.\n\nAfter step zero, put these needs in order for this ground.", "opzioni": ["Being found → First aid → Warmth → Water → Food", "First aid → Being found → Warmth → Water → Food", "First aid → Warmth → Being found → Water → Food", "First aid → Water → Warmth → Being found → Food"], "giusta": 2, "spiegazione": "S11’s order: “Breathing, then out of the water · first aid · warmth · being found · water · food last.” With everyone aboard and dry, the first need is already met: the cut hand comes first, then warmth on the cold lake, ahead of calling and signaling.", "rimando": "Scenario S11 · Skill 12.4-1", "medica": true}, {"id": "fld-02-026", "area": "In the Field", "scenario": "S12", "tipo": "scelta", "domanda": "A rescue helicopter is coming in to land in the clearing by your camp. Your tarp and sleeping bags lie loose on the ground.\n\nWhat do you do first?", "opzioni": ["Light the signal fire for more smoke", "Stow or tie down the loose gear", "Wave the tarp overhead so the crew sees you", "Run out to meet it as it touches down"], "giusta": 1, "spiegazione": "S12’s step zero: “A helicopter coming in: stow or tie down anything light, shield your eyes, and wait for the crew to come to you.” The rotor wash can blow loose gear into the rotor (9.3-4), and you never run to it the moment it lands.", "rimando": "Scenario S12 · Skill 9.3-4", "medica": false}, {"id": "fld-02-027", "area": "In the Field", "scenario": "S12", "tipo": "scelta", "domanda": "A search plane flies low across the valley on a sunny morning, and you’re flashing your signal mirror at it. The bright spot sits right on the cockpit.\n\nWhat do you do?", "opzioni": ["Stop flashing at once so you don’t blind them", "Hold it on the cockpit until the plane turns", "Swing it off and sweep the empty horizon", "Keep it on the cockpit only a few seconds"], "giusta": 3, "spiegazione": "S12, step 1: “Aim the mirror flash at the aircraft, but never hold it on the cockpit for more than a few seconds.” A longer beam can blind the crew (9.1-3), and you keep signaling until the aircraft answers (step 5).", "rimando": "Scenario S12 · Skill 9.1-3", "medica": false}, {"id": "fld-02-028", "area": "In the Field", "scenario": "S12", "tipo": "scelta", "domanda": "It’s after dark, and you hear an aircraft somewhere overhead but can’t see it. You have a flashlight, but no signal fire laid.\n\nWhat do you do first?", "opzioni": ["Aim it toward the sound, flashing in threes", "Shine a steady beam straight up into the sky", "Keep the light off until you can see it", "Shout and wave your arms over your head"], "giusta": 0, "spiegazione": "S12, step 3: “At night, aim a flashlight or strobe at the aircraft or toward its sound, flashing in threes.” Any light helps at night, and a flashing light or a strobe is very effective (9.1-6); you don’t wait to see it.", "rimando": "Scenario S12 · Skill 9.1-6", "medica": false}, {"id": "fld-02-029", "area": "In the Field", "scenario": "S12", "tipo": "ordine", "domanda": "You hear a search plane coming up the valley on a cold, gray afternoon. Your friend has a twisted ankle.\n\nAfter step zero, put these needs in order for this ground.", "opzioni": ["Being seen while it’s near → Threats to life → First aid → Warmth while you wait → Food", "Threats to life → First aid → Warmth while you wait → Being seen while it’s near → Food", "Threats to life → First aid → Being seen while it’s near → Warmth while you wait → Food", "Threats to life → Being seen while it’s near → First aid → Warmth while you wait → Food"], "giusta": 3, "spiegazione": "S12’s order: “Threats to life (S00) · being seen while the aircraft is near · first aid · warmth while you wait · food last.” With an aircraft near, being seen moves ahead of first aid for the twisted ankle; only threats to life come before it.", "rimando": "Scenario S12 · Skill 9.3-2", "medica": false}, {"id": "fld-02-030", "area": "In the Field", "scenario": "S12", "tipo": "scelta", "domanda": "A search plane flies low over your signal site with its landing lights lit. Then it rocks its wings and circles back.\n\nWhat comes next?", "opzioni": ["Hike to the nearest road to meet them", "Stay where you are and signal when asked", "Keep flashing the mirror into its cockpit", "Pack up and walk the way it flew"], "giusta": 1, "spiegazione": "S12, step 5: the aircraft has answered when “it flies low with its landing lights lit, rocks its wings, or answers by radio. Then stay where you are.” Moving makes you harder to find, and the mirror never stays on the cockpit for more than a few seconds.", "rimando": "Scenario S12 · Skill 9.3-2", "medica": false}, {"id": "fld-03-001", "area": "In the Field", "scenario": "S08", "tipo": "ordine", "domanda": "Your car dies on a remote desert road on a hot afternoon, and you coast well off the pavement. Your passenger gashed his hand on the hood latch, and it’s bleeding.\n\nAfter step zero, put these needs in order for this ground.", "opzioni": ["First aid → Water and shade → Being seen → A warm layer for the night → Food", "First aid → Being seen → Water and shade → A warm layer for the night → Food", "Water and shade → First aid → Being seen → A warm layer for the night → Food", "First aid → A warm layer for the night → Being seen → Water and shade → Food"], "giusta": 0, "spiegazione": "First aid comes first: press hard on the bleeding (S00, step 3), because, as Chapter 2 says, “Two things always come first”: step zero and first aid. Then S08’s order follows the heat: water and shade, being seen, a warm layer for the night, food last; in snow, warmth comes before being seen (S07).", "rimando": "Scenario S08 · Skill 12.3-3", "medica": true}, {"id": "fld-03-002", "area": "In the Field", "scenario": "S09", "tipo": "scelta", "domanda": "You’ve rolled away from the hole and crawled to shore, soaked and shivering hard. Your truck is parked just up the bank, with dry clothes behind the seat.\n\nWhat comes next?", "opzioni": ["Take a long swig from the whiskey flask in the glovebox", "Rub your arms and legs hard to get the warm blood moving", "Get in the truck, out of the wind, into dry layers", "Sit out on the bank in the wind and let your clothes dry"], "giusta": 2, "spiegazione": "S09, step 7: “Once out: a warm, dry shelter, dry layers for wet clothes, rewarming and medical help now.” Skill 4.3-2 begins “out of wind and wet, into dry layers,” says never alcohol, and lists rubbing the limbs among the things to avoid.", "rimando": "Scenario S09 · Skill 4.3-2", "medica": true}, {"id": "fld-03-003", "area": "In the Field", "scenario": "S06", "tipo": "scelta", "domanda": "Your group waited out the storm in a hard-topped truck, and it’s now more than 30 minutes since the last thunder. Up the trail you find the friend who went ahead, struck by lightning: he doesn’t respond, and he isn’t breathing.\n\nWhat do you do first?", "opzioni": ["Move him with a dry stick, not your hands", "Touch him, call 911 and start CPR", "Don’t touch him: he may still carry a charge", "Roll him onto his side and wait for help"], "giusta": 1, "spiegazione": "S06, step 5: “Someone struck holds no charge: touch them. Call 911; no breathing, or only gasping: CPR and the AED.” You have already waited the 30 minutes after the last thunder that step 6 asks for, and the side position is for someone who is breathing (S00, step 4).", "rimando": "Scenario S06 · Skill 12.1-4", "medica": true}, {"id": "hom-01-001", "area": "At Home", "scenario": "S13", "tipo": "scelta", "domanda": "The power has been out since a January ice storm, and a generator is running in the attached garage. Your wife feels dizzy and sick, and you get everyone outside to fresh air.\n\nWhich page do you open first?", "opzioni": ["S13 · Power Out in Winter", "S17 · After the Storm: Cut Off, Roads Closed", "S20 · Snowed In for Days", "S15 · Carbon Monoxide Alarm or Symptoms"], "giusta": 3, "spiegazione": "The index is plain: at home, if the air may not be safe, “get everyone out, then go straight to S15.” Dizziness with a generator in the garage could be carbon monoxide, so the cold house waits.", "rimando": "Scenario S13 · Skill 7.4-5", "medica": true}, {"id": "hom-01-002", "area": "At Home", "scenario": "S13", "tipo": "scelta", "domanda": "In the cold woods, the manuals put warmth right after first aid. Tonight you are home in winter, with the power out and the house cooling.\n\nAfter first aid, what comes next at home?", "opzioni": ["Medical needs", "Water", "Safe air", "Warmth, safely"], "giusta": 2, "spiegazione": "In a dark house the order changes: S13 reads “First aid · safe air · medical needs · warmth, safely.” Chapter 2 explains that civilian guidance deals first with the dangers a house creates, like carbon monoxide from a generator or a grill; warmth comes next, made safely.", "rimando": "Scenario S13 · Skill 7.4-1", "medica": false}, {"id": "hom-01-003", "area": "At Home", "scenario": "S13", "tipo": "ordine", "domanda": "A winter storm took the power last night, and the house is down to 55°F. The taps still run, and the generator is still in the shed.\n\nAfter step zero, put these needs in order for this ground.", "opzioni": ["First aid → Safe air → Medical needs → Warmth, safely → Water", "Safe air → First aid → Warmth, safely → Medical needs → Water", "First aid → Safe air → Warmth, safely → Water → Medical needs", "First aid → Warmth, safely → Safe air → Medical needs → Water"], "giusta": 0, "spiegazione": "S13 sets the order for a dark winter house: “First aid · safe air · medical needs · warmth, safely · water · food.” Warmth right after first aid is the order for the cold woods; at home the air and the medical needs come before it, and water can wait while the taps run.", "rimando": "Scenario S13 · Skill 5.3", "medica": false}, {"id": "hom-01-004", "area": "At Home", "scenario": "S13", "tipo": "scelta", "domanda": "Day two of a winter outage, and your father, 78, is shivering and fumbling with his buttons. He is awake, talking clearly, and insists he’s fine.\n\nWhat do you do first?", "opzioni": ["Rub his arms and legs hard to get the blood going", "Make him a warm, sweet drink and wait", "Warm his core first: chest, neck, head, groin", "Heat the kitchen with the oven door open"], "giusta": 2, "spiegazione": "Shivering and fumbling hands are “the early warning of hypothermia,” and S13 says to “warm the body’s core first.” A warm, sweet drink comes later; rubbing the limbs and heating with the oven are things the book says never to do.", "rimando": "Scenario S13 · Skill 4.3-2", "medica": true}, {"id": "hom-01-005", "area": "At Home", "scenario": "S13", "tipo": "scelta", "domanda": "Day three without power, and the living room is at 50°F. Your brother-in-law wants to bring the camp stove in and crack a window, the way you do at deer camp.\n\nWhat does the book say?", "opzioni": ["Fine, while everyone stays awake to watch", "No camp stove indoors, ever, window or not", "Fine, if a window stays open a few inches", "Fine, if the carbon monoxide alarm is working"], "giusta": 1, "spiegazione": "The field manuals warmed a small shelter with a fire and kept a vent open, but S13 says: “In a house the rule is stricter: no grill, camp stove or generator indoors, ever.” An open window or a working alarm doesn’t change that.", "rimando": "Scenario S13 · Skill 7.4-1", "medica": true}, {"id": "hom-01-006", "area": "At Home", "scenario": "S14", "tipo": "scelta", "domanda": "The power has been out for two days in a heat wave, and it’s 96°F indoors. Your mother, 80, is suddenly confused, her words slurred and her skin hot.\n\nWhat do you do first?", "opzioni": ["Give her fever medicine and sit her by a fan", "Get her to drink a big glass of cold water", "Drive her to a cooling center through 2-1-1", "Call 911 and start cooling her right away"], "giusta": 3, "spiegazione": "S14’s step zero: “Confusion or collapse in the heat: call 911 and cool them at once.” Drinks are only for someone fully awake and able to swallow, and 4.3-5 says to avoid fever medicine.", "rimando": "Scenario S14 · Skill 4.3-5", "medica": true}, {"id": "hom-01-007", "area": "At Home", "scenario": "S14", "tipo": "scelta", "domanda": "Third day of a heat wave without power, and no generator or engine is running. You’re sweating heavily, a little dizzy, with cramps in your legs.\n\nWhat do you do first?", "opzioni": ["Get somewhere cooler, use wet cloths, sip water", "Have a cold beer or an iced coffee to cool off", "Take salt tablets with a big glass of cold water", "Sit by the fan, though it’s 95°F indoors"], "giusta": 0, "spiegazione": "S14’s first step: “Heavy sweating, dizziness or cramps: get somewhere cooler, use wet cloths, sip cool water.” Salt tablets, alcohol and caffeine are on 4.3-4’s avoid list, and a fan helps only below 90°F indoors.", "rimando": "Scenario S14 · Skill 4.3-4", "medica": true}, {"id": "hom-01-008", "area": "At Home", "scenario": "S14", "tipo": "scelta", "domanda": "A heat wave and no power, so you run the generator in the attached garage to keep the fans going. By evening both kids have a headache and feel sick to their stomachs.\n\nWhat do you do first?", "opzioni": ["Everyone outside to fresh air, then open S15", "Shut off the generator, then open S15", "All down to the cool basement, then open S14", "Wet cloths and sips of water, then open S14"], "giusta": 0, "spiegazione": "A headache and nausea with an engine running nearby could be carbon monoxide, not the heat: S14’s step zero says “everyone outside, then S15.” Walking into the garage to shut it off, or blaming the heat, keeps everyone in the bad air.", "rimando": "Scenario S14 · Skill 7.4-5", "medica": true}, {"id": "hom-01-009", "area": "At Home", "scenario": "S14", "tipo": "ordine", "domanda": "Day two of a summer outage, 94°F inside, with insulin in the dead fridge. The generator sits far out in the yard, and the taps still run.\n\nAfter step zero, put these needs in order for this ground.", "opzioni": ["First aid → Safe air → Cool air and water → Medical needs → Food", "First aid → Medical needs → Safe air → Cool air and water → Food", "First aid → Cool air and water → Safe air → Medical needs → Food", "First aid → Safe air → Medical needs → Cool air and water → Food"], "giusta": 3, "spiegazione": "S14 reads “First aid · safe air · medical needs · cool air and water · food.” In the field heat, water moves up; in a dark house, the air and the medicines come first.", "rimando": "Scenario S14 · Skill 5.3-4", "medica": false}, {"id": "hom-01-010", "area": "At Home", "scenario": "S14", "tipo": "scelta", "domanda": "Stranded in desert heat, the manuals move water and shade up the list. Today the heat is at home, in a house with no power.\n\nAfter first aid, what comes next at home?", "opzioni": ["Shelter from the sun", "Medical needs", "Safe air", "Cool air and water"], "giusta": 2, "spiegazione": "In the field heat, water and shade move up; in a house with no power, S14 puts safe air right after first aid: “First aid · safe air · medical needs · cool air and water.” The dangers the house creates, like a generator too close, come first.", "rimando": "Scenario S14 · Skill 7.4-2", "medica": false}, {"id": "hom-01-011", "area": "At Home", "scenario": "S15", "tipo": "scelta", "domanda": "The carbon monoxide alarm goes off at 2 a.m. Your two grandkids are asleep upstairs, and nobody feels sick.\n\nWhat do you do first?", "opzioni": ["Open every window and wait for it to stop", "Wake every sleeper and get everyone outside", "Call 911 from the kitchen and ask what to do", "Find what’s running and shut it off"], "giusta": 1, "spiegazione": "S15’s step zero: “Wake every sleeper and get everyone outside to fresh air at once. Then call 911.” A sleeper can be overcome before noticing, and 7.4-3 warns against looking for the cause while the alarm sounds.", "rimando": "Scenario S15 · Skill 7.4-5", "medica": true}, {"id": "hom-01-012", "area": "At Home", "scenario": "S15", "tipo": "scelta", "domanda": "Everyone is out on the lawn, and you’ve called 911. While you wait, the alarm inside goes quiet.\n\nWhat comes next?", "opzioni": ["Go in for coats and the fridge medicines", "Stay out until the crews say it’s safe", "Go back in now that the alarm has stopped", "Go in and open the windows to air it out"], "giusta": 1, "spiegazione": "S15: “Nobody goes back in to look for the cause, even if the alarm stops. Wait for the emergency crews.” The same goes for medicines: “Nobody goes back in for them.”", "rimando": "Scenario S15 · Skill 7.4-5", "medica": true}, {"id": "hom-01-013", "area": "At Home", "scenario": "S15", "tipo": "scelta", "domanda": "You’ve pulled your brother out to the porch after the alarm, and 911 is on the way. He doesn’t respond when you tap and shout, and he is only gasping.\n\nWhat do you do first?", "opzioni": ["Turn him onto his side and watch his breathing", "Keep him warm and wait for the crews", "Start CPR, pushing hard and fast mid-chest", "Sit him up so he can get more air"], "giusta": 2, "spiegazione": "S15: “Not responding and not breathing normally: start CPR.” Gasping is not breathing, as 4.1-11 warns; the side position is for someone who does breathe.", "rimando": "Scenario S15 · Skill 4.1-11", "medica": true}, {"id": "hom-01-014", "area": "At Home", "scenario": "S15", "tipo": "ordine", "domanda": "The alarm sounded while the furnace ran on a snowy night, and your wife has a pounding headache. You’re all out of the house, and the crews are on the way.\n\nAfter step zero, put these needs in order for this ground.", "opzioni": ["First aid → Fresh air → Medical needs → The cause, only once crews say it is safe", "Fresh air → First aid → The cause, only once crews say it is safe → Medical needs", "Fresh air → The cause, only once crews say it is safe → First aid → Medical needs", "Fresh air → First aid → Medical needs → The cause, only once crews say it is safe"], "giusta": 3, "spiegazione": "On this page fresh air comes even before first aid: “Fresh air · first aid · medical needs · the cause, only once crews say it is safe.” The cause is always last, and never before the crews give the word.", "rimando": "Scenario S15 · Skill 7.4-5", "medica": true}, {"id": "hom-01-015", "area": "At Home", "scenario": "S15", "tipo": "scelta", "domanda": "The alarm went off, and everyone is outside with a headache. Your neighbor, who learned first aid in the Army, says nobody has cherry-red lips, so it’s a false alarm.\n\nWhat do you do first?", "opzioni": ["Stay out, call 911 and wait for the crews", "Go back in, open the windows, test the alarm", "Go back in: no red lips, no poisoning", "Check everyone’s lips again in good light"], "giusta": 0, "spiegazione": "The 1992 field manual named cherry-red lips as a sign, but S15’s Today’s practice note says this book doesn’t use it: “a sleeper can die before any symptom (CDC).” Step zero stands: stay out, call 911, and wait for the crews.", "rimando": "Scenario S15 · Skill 7.4-5", "medica": true}, {"id": "hom-01-016", "area": "At Home", "scenario": "S16", "tipo": "scelta", "domanda": "A hurricane is two days out, and officials have just ordered your zone to evacuate. The plywood for the windows is still stacked in the garage.\n\nWhat do you do first?", "opzioni": ["Wait for the radio to say how strong it is", "Leave now, with the kit and medicines", "Nail the plywood up, then leave", "Fill the tub and jugs before you go"], "giusta": 1, "spiegazione": "S16’s step zero: “Officials order you to evacuate: go at once, with the kit and medicines.” Boarding up and storing water belong to the days before an order, not after one.", "rimando": "Scenario S16 · Skill 6.4-6", "medica": false}, {"id": "hom-01-017", "area": "At Home", "scenario": "S16", "tipo": "scelta", "domanda": "The weather radio says a hurricane watch is in effect for your county. No one has told you to leave.\n\nWhat do you do first?", "opzioni": ["Get ready: check the plan and the supplies", "Tape an X across every window", "Leave now for the nearest shelter", "Wait until a warning comes before doing anything"], "giusta": 0, "spiegazione": "S16: “A watch: get ready. A warning: act now.” Leaving at once is for an evacuation order, and tape doesn’t protect windows.", "rimando": "Scenario S16 · Skill 12.1-3", "medica": false}, {"id": "hom-01-018", "area": "At Home", "scenario": "S16", "tipo": "scelta", "domanda": "A hurricane warning is up, and your area is not under an evacuation order. You have plywood, a drill and two rolls of duct tape.\n\nHow do you protect the windows?", "opzioni": ["Open each window a crack to ease the pressure", "Tape a big X across each pane of glass", "Close the blinds and pull the curtains tight", "Fit shutters or nail plywood to the frames"], "giusta": 3, "spiegazione": "S16 and 6.4-3 give one way to ready the windows for a hurricane: “Fit storm shutters or nail plywood to the frames. Tape doesn’t protect.”", "rimando": "Scenario S16 · Skill 6.4-3", "medica": false}, {"id": "hom-01-019", "area": "At Home", "scenario": "S16", "tipo": "ordine", "domanda": "A hurricane is forecast to hit in three days, and nobody in the house is hurt. You have the radio on and a long list in front of you.\n\nAfter step zero, put these needs in order for this ground.", "opzioni": ["The house → Supplies → Where to go → Officials’ orders → Medical needs", "Supplies → The house → Officials’ orders → Medical needs → Where to go", "Officials’ orders → Medical needs → Where to go → Supplies → The house", "Officials’ orders → Where to go → Supplies → The house → Medical needs"], "giusta": 2, "spiegazione": "S16 reads “Officials’ orders · first aid · medical needs · where to go · supplies · the house.” Boarding up feels urgent, but on this page the house comes last, after the orders, the medicines and a place to go.", "rimando": "Scenario S16 · Skill 6.4-6", "medica": false}, {"id": "hom-01-020", "area": "At Home", "scenario": "S16", "tipo": "scelta", "domanda": "A hurricane warning is up, and the power company expects outages of a week or more. Your wife uses a home oxygen machine, and no backup you have can run it that long.\n\nWhat do you do first?", "opzioni": ["Stay, and call the power company if it fails", "Go now, before the machine loses power", "Run a generator in the garage for it", "Stock up on water and canned food first"], "giusta": 1, "spiegazione": "S16’s medical line ends: “A device that will lose power: go.” 6.4-6 gives the same reason to leave, and a generator never runs in a garage.", "rimando": "Scenario S16 · Skill 5.3-4", "medica": true}, {"id": "hom-01-021", "area": "At Home", "scenario": "S17", "tipo": "scelta", "domanda": "The storm has passed, and you come down to a dark kitchen at dawn. There is a smell of gas and a faint hiss near the stove.\n\nWhat do you do first?", "opzioni": ["Flip on the lights to find the leak", "Open the windows and shut off the stove", "Get everyone out, touching no switches", "Call 911 from the kitchen phone"], "giusta": 2, "spiegazione": "S17’s step zero: “Gas smell or hiss: everyone out, no lights or switches; once out, call 911 or the fire department.” The call comes from outside, never from the kitchen.", "rimando": "Scenario S17 · Skill 6.4-7", "medica": false}, {"id": "hom-01-022", "area": "At Home", "scenario": "S17", "tipo": "scelta", "domanda": "After the storm, a power line lies across your driveway, and it isn’t sparking. Your neighbor across the road needs help moving a tree off his porch.\n\nWhat do you do first?", "opzioni": ["Stay at least 20 feet away from the line", "Step over it carefully in your rubber boots", "Drive over it slowly in the truck", "Move it aside with a dry wooden rake"], "giusta": 0, "spiegazione": "S17’s step zero: “Downed power line: stay 20 feet away.” 6.4-3 says the same, and 3.5-2 warns against going near downed lines while you check on neighbors.", "rimando": "Scenario S17 · Skill 6.4-3", "medica": false}, {"id": "hom-01-023", "area": "At Home", "scenario": "S17", "tipo": "scelta", "domanda": "Clearing storm debris, your son slices his forearm on broken glass, and it bleeds steadily. The house is sound, and there is no smell of gas.\n\nWhat do you do first?", "opzioni": ["Rinse the cut clean under the tap", "Text your out-of-town contact for help", "Tarp the broken window before it rains", "Press hard on it with a clean cloth"], "giusta": 3, "spiegazione": "S17’s first step: “People first: press hard on bleeding; keep floodwater out of wounds.” Cleaning comes once the bleeding has stopped (4.2-1), and the window and the text come later.", "rimando": "Scenario S17 · Skill 4.1-5", "medica": true}, {"id": "hom-01-024", "area": "At Home", "scenario": "S17", "tipo": "ordine", "domanda": "The hurricane has passed: roads closed, no power, a broken window upstairs. Everyone has a scrape or two, and the taps still run for now.\n\nAfter step zero, put these needs in order for this ground.", "opzioni": ["Shelter → First aid → Safe air → Water → Medical needs", "First aid → Shelter → Water → Safe air → Medical needs", "First aid → Safe air → Medical needs → Shelter → Water", "First aid → Safe air → Shelter → Medical needs → Water"], "giusta": 2, "spiegazione": "S17 reads “First aid · safe air · medical needs · shelter · water · food.” The broken window matters, but the air in the house and the medicines come before it.", "rimando": "Scenario S17 · Skill 7.4-2", "medica": false}, {"id": "hom-01-025", "area": "At Home", "scenario": "S17", "tipo": "scelta", "domanda": "The day after the storm, rain is blowing in through a broken upstairs window. The wind is still gusting hard.\n\nWhat do you do about the window?", "opzioni": ["Tarp it now from the roof, before more rain", "Wait for calm, then tarp it from a ladder", "Tarp it now from a ladder, wind or not", "Hold the tarp on from the roof with a helper"], "giusta": 1, "spiegazione": "S17: “Tarp broken windows tight from the ground or a ladder; never in wind or rain, never from the roof.” 6.4-3 adds that OSHA warns of falls and electrocution.", "rimando": "Scenario S17 · Skill 6.4-3", "medica": false}, {"id": "hom-01-026", "area": "At Home", "scenario": "S18", "tipo": "scelta", "domanda": "It’s night, and floodwater is coming in under the front door, rising fast. The r
