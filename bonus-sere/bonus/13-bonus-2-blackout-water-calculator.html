<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>App</title>
<style>
:root { --acc: #1f3a5f; --sec: #e9b949; --ok: #1e7d4f; --ko: #b3261e; --bg: #f8ecd8; --card: #ffffff;
  --ink: #1b1f24; --muted: #5f6873; --line: #dde1e6; --r: 14px; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  -webkit-text-size-adjust: 100%; }
header.app { background: var(--acc); color: #fff; padding: 18px 16px 16px; }
header.app .in, main .in, footer.app .in { max-width: 860px; margin: 0 auto; }
header.app .et { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--sec); }
header.app h1 { margin: 4px 0 2px; font-size: 24px; line-height: 1.15; }
header.app .sub { opacity: .9; font-size: 14px; }
main { padding: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; margin: 0 0 14px;
  box-shadow: 0 1px 2px rgba(0,0,0,.04); }
h2 { font-size: 19px; margin: 0 0 10px; color: var(--acc); }
h3 { font-size: 16px; margin: 14px 0 6px; }
.muted { color: var(--muted); font-size: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1 1 auto; }
button, .btn { font: inherit; border: 0; border-radius: 10px; padding: 11px 16px; cursor: pointer; background: var(--acc);
  color: #fff; font-weight: 600; min-height: 44px; }
button.sec, .btn.sec { background: #e8ecf1; color: var(--ink); }
button.ghost { background: transparent; color: var(--acc); border: 1px solid var(--line); }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--sec); outline-offset: 2px; }
input[type=text], input[type=number], input[type=date], select, textarea { font: inherit; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 10px; background: #fff; min-height: 44px; width: 100%; }
label.lab { display: block; font-weight: 600; margin: 10px 0 4px; font-size: 14px; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; background: #eef2f7; color: var(--acc);
  font-size: 12px; font-weight: 600; }
.bar { height: 10px; background: #e8ecf1; border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }
.ok { color: var(--ok); } .ko { color: var(--ko); }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; background: #eef2f7; padding: 8px; }
table.t td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
footer.app { padding: 18px 16px 30px; color: var(--muted); font-size: 12px; }
footer.app p { margin: 4px 0; }
.nascosto { display: none !important; }
.modale { position: fixed; inset: 0; background: rgba(10,15,25,.55); display: flex; align-items: center;
  justify-content: center; padding: 16px; z-index: 50; }
.modale .card { max-width: 440px; width: 100%; }
#porta { min-height: 60vh; display: flex; align-items: center; justify-content: center; }
#porta .card { max-width: 420px; width: 100%; }
@media (max-width: 520px) { header.app h1 { font-size: 21px; } main { padding: 12px; } .card { padding: 14px; } }
@media print { header.app, footer.app, button { display: none !important; } body { background: #fff; } .card { border: 0; box-shadow: none; } }

.campi { display: grid; gap: 4px 14px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.ris { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); margin-top: 14px; }
.ris .r { background: #f4f6f1; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.ris .v { font-size: 30px; font-weight: 800; color: var(--acc); line-height: 1.1; }
.ris .u { font-size: 14px; color: var(--muted); }
.ris .r.scaduto { background: #fbecea; border-color: #e7b9b3; }
.ris .r.scaduto .v { color: var(--ko); }
.nota { font-size: 14px; color: var(--muted); margin: 10px 0 0; }
.avviso { border-left: 6px solid var(--sec); }
.avviso ul { margin: 0; padding-left: 20px; } .avviso li { margin: 6px 0; }
.salti { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.salti a { display: inline-block; padding: 8px 12px; border-radius: 999px; background: #eef1ea; color: var(--acc); font-weight: 600; font-size: 14px; text-decoration: none; }
.intro p { margin: 0; }
.prima { margin-top: 10px; align-items: flex-end; }
.prima .lab { flex: 1 1 100%; margin-bottom: 0; }
.prima input { flex: 0 0 120px; width: 120px; }
.stato { font-size: 17px; margin: 14px 0 0; }
  .solo-stampa { display: none; }
@media print {
  .solo-stampa { display: block !important; }
  section.card { display: none !important; }
  section#sez_riepilogo, section#sez_limiti, section#sez_generatore { display: block !important; }
}

</style></head>
<body>
<header class="app"><div class="in"><div class="et"></div><h1></h1><div class="sub"></div></div></header>
<main><div class="in">
<section class="card intro">
  <p id="t_intro"></p>
  <nav class="salti" id="salti"></nav>
</section>

<section class="card avviso" id="sez_generatore">
  <h2 id="t_generatore"></h2>
  <ul id="generatore"></ul>
</section>

<section class="card" id="sez_acqua">
  <h2 id="t_acqua"></h2>
  <p class="muted" id="t_acqua_intro"></p>
  <div class="campi">
    <div><label class="lab" for="persone" id="t_persone"></label><input id="persone" type="number" inputmode="numeric" min="1" max="30" step="1" value="4"></div>
  </div>
  <div class="ris" id="ris_acqua"></div>
  <p class="nota" id="t_acqua_nota"></p>
</section>

<section class="card" id="sez_candeggina">
  <h2 id="t_candeggina"></h2>
  <p class="muted" id="t_candeggina_intro"></p>
  <div class="campi">
    <div><label class="lab" for="quantita" id="t_quantita"></label><input id="quantita" type="number" inputmode="decimal" min="0.1" max="500" step="any" value="1"></div>
    <div><label class="lab" for="unita" id="t_unita"></label><select id="unita"><option value="gal" id="t_gal"></option><option value="l" id="t_l"></option></select></div>
    <div><label class="lab" for="forza" id="t_forza"></label><select id="forza"><option value="6" id="t_f6"></option><option value="8.25" id="t_f825"></option><option value="altra" id="t_faltra"></option></select></div>
    <div><label class="lab" for="acqua_tipo" id="t_acqua_tipo"></label><select id="acqua_tipo"><option value="limpida" id="t_limpida"></option><option value="torbida" id="t_torbida"></option></select></div>
  </div>
  <div class="ris" id="ris_candeggina"></div>
  <p class="nota" id="t_candeggina_nota"></p>
</section>

<section class="card" id="sez_bollitura">
  <h2 id="t_bollitura"></h2>
  <p class="muted" id="t_bollitura_intro"></p>
  <div class="campi">
    <div><label class="lab" for="quota" id="t_quota"></label><input id="quota" type="number" inputmode="numeric" min="0" max="20000" step="1" value="500"></div>
    <div><label class="lab" for="quota_unita" id="t_quota_unita"></label><select id="quota_unita"><option value="ft" id="t_ft"></option><option value="m" id="t_m"></option></select></div>
  </div>
  <div class="ris" id="ris_bollitura"></div>
  <p class="nota" id="t_bollitura_nota"></p>
</section>

<section class="card avviso" id="sez_limiti">
  <h2 id="t_limiti"></h2>
  <ul id="limiti"></ul>
</section>

<section class="card" id="sez_frigo">
  <h2 id="t_frigo"></h2>
  <p class="muted" id="t_frigo_intro"></p>
  <div class="row">
    <button id="spenta"></button>
    <button class="sec" id="tornata"></button>
  </div>
  <div class="row prima">
    <label class="lab" for="ore_fa" id="t_ore_fa"></label>
    <input id="ore_fa" type="number" inputmode="decimal" min="0" max="96" step="0.5" placeholder="0">
    <button class="ghost" id="segna_prima"></button>
  </div>
  <p id="frigo_stato" class="stato"></p>
  <div class="ris" id="ris_frigo"></div>
  <p class="nota" id="t_frigo_regola"></p>
  <p class="nota" id="t_frigo_medicine"></p>
  <p class="nota" id="t_frigo_limite"></p>
</section>

<section class="card" id="sez_riepilogo">
  <h2 id="t_riepilogo"></h2>
  <p class="muted" id="t_riepilogo_intro"></p>
  <div id="riepilogo"></div>
  <div class="row" style="margin-top:12px"><button id="stampa"></button></div>
</section>

</div></main>
<footer class="app"><div class="in"></div></footer>
<script>

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

};
// FNV-1a 32 bit con sale: non è una serratura, è un deterrente (il codice non sta in chiaro nel file).

function finestra(titolo, testo, bottoni) {
  return new Promise((ok) => {
    const m = document.createElement("div");
    m.className = "modale";

  `<div class="r"><div class="muted">${esc(etichetta)}</div><div class="v">${valore}</div><div class="u">${esc(unita)}</div>${extra}</div>`;

}
function salva() {
  Memoria.scrivi("valori", { persone: $("#persone").value, quantita: $("#quantita").value, unita: $("#unita").value,
    forza: $("#forza").value, acqua_tipo: $("#acqua_tipo").value, quota: $("#quota").value, quota_unita: $("#quota_unita").value });
}
function ricarica() {
  const v = Memoria.leggi("valori", {});
  ["persone", "quantita", "unita", "forza", "acqua_tipo", "quota", "quota_unita"].forEach((k) => { if (v[k] !== undefined) $("#" + k).value = v[k]; });
}

// 1 · L'acqua di scorta: persone × giorni × 1 gallone (8.1-3)
function acqua() {
  const p = intero("persone", 1, 30);
  if (p === null) { $("#ris_acqua").innerHTML = `<p class="ko">${esc(T("controlla_persone", "Enter how many people live in the house (1 to 30)."))}</p>`; return null; }
  const g3 = p * DATI.galloni_al_giorno * DATI.giorni_minimo, g14 = p * DATI.galloni_al_giorno * DATI.giorni_obiettivo;
  $("#ris_acqua").innerHTML =
    box(T("minimo", "At least: 3 days"), num(g3), T("galloni", "gallons") + ` · ${num(g3 * GAL_L)} ` + T("litri", "liters")) +
    box(T("obiettivo", "If you can: 2 weeks"), num(g14), T("galloni", "gallons") + ` · ${num(g14 * GAL_L)} ` + T("litri", "liters"));
  return { p, g3, g14 };
}

// 2 · Le gocce di candeggina (8.3-4): 6% → 8 gocce, 8,25% → 6 gocce per gallone; doppio se torbida, colorata o molto fredda
function candeggina() {
  const q = intero("quantita", 0.1, 500);
  const forza = $("#forza").value, torbida = $("#acqua_tipo").value === "torbida";
  if (forza === "altra") { $("#ris_candeggina").innerHTML = `<p class="ko">${esc(T("forza_altra_msg", ""))}</p>`; return null; }
  if (q === null) { $("#ris_candeggina").innerHTML = `<p class="ko">${esc(T("controlla_quantita", "Enter the size of the container (0.1 to 500)."))}</p>`; return null; }
  const galloni = $("#unita").value === "l" ? q / GAL_L : q;
  const perGallone = DATI.gocce_per_gallone[forza] * (torbida ? 2 : 1);
  const gocce = Math.ceil(galloni * perGallone - 1e-9);
  // contenitori grandi, solo 6%: la misura del CDC in millilitri (½ mL per gallone di candeggina al 5-9%, = 8 gocce)
  const ml = forza === "6" && galloni >= DATI.ml_da_galloni ? galloni * DATI.ml_per_gallone * (torbida ? 2 : 1) : null;
  $("#ris_candeggina").innerHTML =
    box(T("gocce", "Drops of bleach"), num(gocce), T("gocce_unita", "drops, rounded up"),
      ml === null ? "" : `<div class="u">${esc(T("ml_prima", "Or measure"))} <strong>${esc(num(ml, ml % 1 ? 1 : 0))} mL</strong> ${esc(T("ml_dopo", ""))}</div>`) +
    box(T("attesa", "Then wait"), num(DATI.attesa_minuti), T("minuti", "minutes"), `<div class="u">${esc(T("attesa_dopo", ""))}</div>`);
  return { q, unita: $("#unita").value, forza, torbida, gocce };
}

// 3 · I minuti di bollitura (8.3-3): 1 minuto; 3 sopra i 5.000 piedi (la soglia più severa, dell'EPA, come nel libro)
function bollitura() {
  const q = intero("quota", 0, 20000);
  if (q === null) { $("#ris_bollitura").innerHTML = `<p class="ko">${esc(T("controlla_quota", "Enter your elevation (0 to 20,000)."))}</p>`; return null; }
  const piedi = $("#quota_unita").value === "m" ? q * M_FT : q;
  const minuti = piedi > DATI.soglia_piedi ? DATI.minuti_sopra : DATI.minuti_sotto;
  $("#ris_bollitura").innerHTML = box(T("bolli", "Full rolling boil"), num(minuti), minuti === 1 ? T("minuto", "minute") : T("minuti", "minutes"),
    `<div class="u">${esc(piedi > DATI.soglia_piedi ? T("sopra", "") : T("sotto", ""))}</div>`);
  return { q, unita: $("#quota_unita").value, minuti };
}

// 5 · L'orologio del frigo (11.4-1): frigo chiuso circa 4 ore, congelatore pieno 48, mezzo pieno 24
function durata(ms) {
  const m = Math.max(0, Math.floor(ms / 60000));
  const h = Math.floor(m / 60), r = m % 60;
  return h ? `${h} h ${String(r).padStart(2, "0")} min` : `${r} min`;
}
function frigo() {
  const inizio = Memoria.leggi("spenta_alle", null);
  $("#tornata").disabled = !inizio;
  if (!inizio) {
    $("#frigo_stato").textContent = T("frigo_spento_no", "");
    $("#ris_frigo").innerHTML = "";
    return null;
  }
  const passato = Date.now() - inizio;
  $("#frigo_stato").innerHTML = `${esc(T("frigo_da", "Power off for"))} <strong>${esc(durata(passato))}</strong> · ${esc(T("frigo_dalle", "since"))} ${esc(new Date(inizio).toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit" }))}`;
  $("#ris_frigo").innerHTML = DATI.limiti_frigo.map((l) => {
    const resta = l.ore * ORA - passato;
    const fuori = resta <= 0;
    return `<div class="r ${fuori ? "scaduto" : ""}"><div class="muted">${esc(l.etichetta)}</div>
      <div class="v">${fuori ? esc(T("passato", "Past")) : esc(durata(resta))}</div>
      <div class="u">${esc(fuori ? l.dopo : T("ancora", "left, if the door stays shut"))}</div></div>`;
  }).join("");
  return { passato };
}
function spenta(oreFa) {
  Memoria.scrivi("spenta_alle", Date.now() - (oreFa || 0) * ORA);
  frigo(); riepilogo();
}

// 7 · Il riepilogo da stampare
function riepilogo() {
  const a = acqua(), c = candeggina(), b = bollitura(), f = frigo();
  const righe = [];
  const unitaQ = (q, u) => u === "l" ? (q === 1 ? T("litro", "liter") : T("litri", "liters")) : (q === 1 ? T("gallone", "gallon") : T("galloni", "gallons"));
  if (a) righe.push([T("r_acqua", "Water to store"), `${a.p} ${a.p === 1 ? T("persona", "person") : T("persone_n", "people")}: ${num(a.g3)} ${T("galloni", "gallons")} (3 ${T("giorni", "days")}) · ${num(a.g14)} ${T("galloni", "gallons")} (2 ${T("settimane", "weeks")})`]);
  if (c) righe.push([T("r_candeggina", "Bleach"), `${num(c.q, c.q % 1 ? 1 : 0)} ${unitaQ(c.q, c.unita)} · ${c.forza}% · ${c.torbida ? T("torbida_breve", "cloudy, colored or very cold") : T("limpida_breve", "clear")}: ${num(c.gocce)} ${T("gocce_breve", "drops")}, ${T("attesa_breve", "wait 30 minutes")}`]);
  if (b) righe.push([T("r_bollitura", "Boiling"), `${num(b.q)} ${b.unita === "m" ? T("m_breve", "m") : T("ft_breve", "ft")}: ${b.minuti} ${b.minuti === 1 ? T("minuto", "minute") : T("minuti", "minutes")}`]);
  if (f) righe.push([T("r_frigo", "Power off"), durata(f.passato)]);
  $("#riepilogo").innerHTML = `<p class="solo-stampa"><strong>${esc(CONFIG.titolo)}</strong><br>${esc(T("per_lettori", "For readers of"))} <i>${esc(CONFIG.libro)}</i></p>
    <table class="t"><tbody>${righe.map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join("")}</tbody></table>
    <p class="nota">${esc(T("riepilogo_avvisi", ""))}</p><p class="nota"><strong>${esc(T("riepilogo_911", ""))}</strong></p>`;
}

function avvia() {
  [["t_intro", "intro"], ["t_acqua", "acqua"], ["t_acqua_intro", "acqua_intro"], ["t_persone", "persone"], ["t_acqua_nota", "acqua_nota"],
   ["t_candeggina", "candeggina"], ["t_candeggina_intro", "candeggina_intro"], ["t_quantita", "quantita"], ["t_unita", "unita"],
   ["t_gal", "gal"], ["t_l", "l"], ["t_forza", "forza"], ["t_f6", "f6"], ["t_f825", "f825"], ["t_faltra", "faltra"],
   ["t_acqua_tipo", "acqua_tipo"], ["t_limpida", "limpida"], ["t_torbida", "torbida"], ["t_candeggina_nota", "candeggina_nota"],
   ["t_bollitura", "bollitura"], ["t_bollitura_intro", "bollitura_intro"], ["t_quota", "quota"], ["t_quota_unita", "quota_unita"],
   ["t_ft", "ft"], ["t_m", "m"], ["t_bollitura_nota", "bollitura_nota"], ["t_limiti", "limiti"],
   ["t_frigo", "frigo"], ["t_frigo_intro", "frigo_intro"], ["spenta", "spenta"], ["tornata", "tornata"], ["t_ore_fa", "ore_fa"],
   ["segna_prima", "segna_prima"], ["t_frigo_regola", "frigo_regola"], ["t_frigo_medicine", "frigo_medicine"], ["t_frigo_limite", "frigo_limite"],
   ["t_generatore", "generatore"], ["t_riepilogo", "riepilogo"], ["t_riepilogo_intro", "riepilogo_intro"], ["stampa", "stampa"]]
    .forEach(([id, k]) => scrivi(id, k, ""));
  $("#salti").innerHTML = DATI.salti.map(([href, k]) => `<a href="#${href}">${esc(T(k, ""))}</a>`).join("");
  lista("#limiti", DATI.limiti_calcolo);
  lista("#generatore", DATI.generatore);
  ricarica();
  $$("#sez_acqua input, #sez_candeggina input, #sez_candeggina select, #sez_bollitura input, #sez_bollitura select")
    .forEach((e) => { e.addEventListener("input", () => { salva(); riepilogo(); }); e.addEventListener("change", () => { salva(); riepilogo(); }); });
  $("#spenta").onclick = () => spenta(0);
  $("#segna_prima").onclick = () => { const h = parseFloat($("#ore_fa").value); spenta(isNaN(h) || h < 0 ? 0 : Math.min(h, 96)); };
  $("#tornata").onclick = async () => {
    const si = await finestra(T("tornata_titolo", "Power is back?"), T("tornata_testo", ""), [[T("si_azzera", "Yes, clear the clock"), true], [T("annulla", "Cancel"), false, "sec"]]);
    if (si) { Memoria.togli("spenta_alle"); frigo(); riepilogo(); }
  };
  $("#stampa").onclick = () => { riepilogo(); window.print(); };
  riepilogo();
  setInterval(() => { frigo(); }, 30000);   // a pagina aperta il tempo si aggiorna; a ogni apertura si ricalcola
}

porta(avvia);
</script>
</body></html>
